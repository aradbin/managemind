# The daily usage alarm (ADR 0013, phase-0-plan §9): CPU terminations and
# percentiles for the API and storefront, and every free-plan limit at 70%.
# On an alarm the run fails and a "Usage alarm" issue is opened (or commented
# on) and assigned to the repository owner.
name: Usage alarm

on:
  schedule:
    # 02:07 UTC is 08:07 in Dhaka, before the working day.
    - cron: '7 2 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Add one forced alarm, to check that the issue and its notification arrive
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check usage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @managemind/scripts...
      - run: >-
          pnpm --filter @managemind/scripts exec tsx monitor/usage.ts
          ${{ inputs.test && '--test' || '' }}
