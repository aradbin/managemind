# Store jobs (phase-5b-plan §3.9–§3.12, ADR 0027): exports, purges, demo
# or test stores' resets and report backfills (phase-8-plan §3.9), with the
# demo stores' weekly reset on Fridays. The platform screen, Settings and
# the daily batch write a pending row in platform.tenant_jobs;
# the API starts this workflow with GITHUB_DISPATCH_TOKEN, and the daily run
# picks up anything left (no token, GitHub didn't answer, or a runner was
# lost). The script connects to Neon
# directly with the migration role and reaches R2 and the outbox queue
# through Cloudflare's API, so it uses no Hyperdrive queries and no Worker CPU.
name: Store jobs

on:
  schedule:
    # 20:37 UTC is 02:37 in Dhaka, when stores are quiet.
    - cron: '37 20 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: One job's id (optional; default every pending job)
        required: false

concurrency:
  group: tenant-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Run pending jobs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      R2_BUCKET: managemind-files
      OUTBOX_QUEUE: managemind-outbox
      KV_NAMESPACE: managemind-edge
      STORE_DOMAIN: ${{ vars.STORE_DOMAIN || 'managemind.store' }}
      IN_JOB: ${{ inputs.job }}
    steps:
      # The runner's own psql answers in seconds, so a day with nothing to do
      # costs well under a minute.
      - name: Anything to do?
        id: pending
        run: |
          : "${DATABASE_URL_MIGRATIONS:?the DATABASE_URL_MIGRATIONS secret is not set}"
          # The runner's own condition (scripts/jobs/runner.ts): a purge waits between its dry run and the approval.
          count=$(psql "$DATABASE_URL_MIGRATIONS" -tAc "select count(*) from platform.tenant_jobs
            where kind in ('export', 'purge', 'reset', 'reports_backfill')
              and (status = 'pending' or (status = 'running' and updated_at < now() - interval '90 minutes'))
              and (kind <> 'purge' or exists (select 1 from platform.tenant_purges p
                    where p.job_id = tenant_jobs.id and (p.dry_run is null or p.approved_at is not null)))")
          # Friday mornings in Dhaka the demo stores start again (phase-5b-plan §3.12).
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(TZ=Asia/Dhaka date +%u)" = 5 ]; then
            echo "demo_reset=true" >> "$GITHUB_OUTPUT"
            count=$((count + 1))
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count job(s) to run"
      - if: steps.pending.outputs.count != '0'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - if: steps.pending.outputs.count != '0'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.pending.outputs.count != '0'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.pending.outputs.count != '0'
        run: pnpm install --frozen-lockfile
      - name: Run
        if: steps.pending.outputs.count != '0'
        env:
          DEMO_RESET: ${{ steps.pending.outputs.demo_reset }}
        run: |
          args=()
          if [ -n "$IN_JOB" ]; then args+=(--job "$IN_JOB"); fi
          if [ "$DEMO_RESET" = true ]; then args+=(--demo-reset); fi
          pnpm --filter @managemind/scripts exec tsx jobs/run.ts "${args[@]}"
