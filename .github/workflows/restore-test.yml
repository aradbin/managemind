# The monthly restore test (phase-5b-plan §3.14, ADR 0028), on the first
# Sunday: the newest nightly backup is decrypted with BACKUP_AGE_KEY,
# restored into an empty database on a new Neon branch, and checked against
# production: every table there, row counts within a day's growth, and a
# recent newest order. The branch is deleted whatever happens.
name: Restore test

on:
  schedule:
    # Every day of the month's first week at 04:23 UTC; the job runs only on
    # the Sunday (cron would run on any day that matches either field).
    - cron: '23 4 1-7 * *'
  workflow_dispatch:

concurrency:
  group: restore-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore:
    name: Restore and check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      BACKUP_AGE_KEY: ${{ secrets.BACKUP_AGE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      R2_BUCKET: managemind-files
    steps:
      - name: Today?
        id: when
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$(date -u +%u)" != 7 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BACKUP_AGE_KEY" ]; then
            echo "::warning title=Restore test::BACKUP_AGE_KEY (secret) is not set: the restore test can't run. See ADR 0028."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Postgres 18 client and age
        if: steps.when.outputs.run == 'true'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18 age
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.when.outputs.run == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.when.outputs.run == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.when.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.when.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Download and decrypt
        if: steps.when.outputs.run == 'true'
        run: |
          key="$RUNNER_TEMP/age.key"
          (umask 077; printf '%s\n' "$BACKUP_AGE_KEY" > "$key")
          pnpm --filter @managemind/scripts exec tsx backup/cli.ts latest --out "$RUNNER_TEMP/db.dump.age"
          age --decrypt --identity "$key" --output "$RUNNER_TEMP/db.dump" "$RUNNER_TEMP/db.dump.age"
          rm -f "$key"
      - name: Branch to restore into
        id: branch
        if: steps.when.outputs.run == 'true'
        run: pnpm --filter @managemind/scripts exec tsx backup/cli.ts branch create
      - name: Restore
        if: steps.when.outputs.run == 'true'
        env:
          TARGET: ${{ steps.branch.outputs.url }}
        run: |
          /usr/lib/postgresql/18/bin/pg_restore --no-owner --exit-on-error \
            --dbname="$TARGET" "$RUNNER_TEMP/db.dump"
      - name: Check
        if: steps.when.outputs.run == 'true'
        env:
          TARGET: ${{ steps.branch.outputs.url }}
        run: pnpm --filter @managemind/scripts exec tsx backup/cli.ts check --restored "$TARGET"
      - name: Delete the branch
        if: always() && steps.when.outputs.run == 'true'
        run: |
          rm -f "$RUNNER_TEMP/db.dump" "$RUNNER_TEMP/db.dump.age"
          pnpm --filter @managemind/scripts exec tsx backup/cli.ts branch delete
