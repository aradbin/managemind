# A preview of every pull request (phase-0-plan §8, ADR 0011): its own API and
# storefront Workers on workers.dev, a smoke test, and the URLs in a PR
# comment. The database is the shared Neon `preview` branch, or the PR's own
# branch `pr-<n>` while it has the `db-branch` label. Closing the PR deletes
# its Workers and its own branch.
#
# Every environment shares the account's 100,000 Hyperdrive queries a day, so
# a preview runs the smoke tests only, a docs-only PR gets none, and the
# `full-preview` label adds the E2E flows, the CPU step and Lighthouse while
# today's count leaves room (scripts/preview/scope.ts).
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false
  PR: ${{ github.event.pull_request.number }}
  COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  deploy:
    name: Deploy and smoke test
    # Secrets are not available to forks; other labels change nothing, and
    # removing full-preview needs no new run.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
        github.event.label.name == 'db-branch' ||
        (github.event.action == 'labeled' && github.event.label.name == 'full-preview'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Choose what to run
        id: scope
        env:
          BASE: ${{ github.base_ref }}
        run: >-
          pnpm --filter @managemind/scripts exec tsx preview/choose.ts --base "origin/$BASE"
          ${{ contains(github.event.pull_request.labels.*.name, 'full-preview') && '--full-label' || '' }}

      - name: Choose the database
        id: choice
        if: steps.scope.outputs.deploy == 'true'
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'db-branch') }}
          BASE: ${{ github.base_ref }}
        run: |
          # Names the E2E's seeded stores and people, new for every run (e2e-seed.ts).
          echo "E2E_RUN=${COMMIT_SHA::7}${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          if [ "$LABELED" = true ]; then
            echo "database=own" >> "$GITHUB_OUTPUT"
            echo "describe=own Neon branch pr-$PR (db-branch label)" >> "$GITHUB_OUTPUT"
          else
            echo "database=shared" >> "$GITHUB_OUTPUT"
            echo "describe=shared Neon branch preview" >> "$GITHUB_OUTPUT"
            # The shared branch follows master; a PR's new migrations need its own branch.
            if ! git diff --quiet "origin/$BASE...HEAD" -- packages/db/migrations; then
              echo "flags=--skip-migrations" >> "$GITHUB_OUTPUT"
              echo "describe=shared Neon branch preview, WITHOUT this PR's migrations (add the db-branch label)" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Sentry settings for the admin build
        if: steps.scope.outputs.deploy == 'true'
        run: |
          echo "VITE_SENTRY_DSN=$(jq -r .projects.admin.dsn scripts/sentry.json)" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_ENVIRONMENT=preview" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_RELEASE=$COMMIT_SHA" >> "$GITHUB_ENV"
          # Turnstile's published always-pass test key (phase-4-plan §3.15).
          echo "VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=./apps/*
        if: steps.scope.outputs.deploy == 'true'

      - name: Database (Neon branch, migrations, seed, Hyperdrive, E2E people)
        id: database
        if: steps.scope.outputs.deploy == 'true'
        run: >-
          pnpm --filter @managemind/scripts exec tsx preview/database.ts
          --pr "$PR" --database ${{ steps.choice.outputs.database }} ${{ steps.choice.outputs.flags }}
          --e2e "$E2E_RUN"

      - name: Worker configs
        id: workers
        if: steps.scope.outputs.deploy == 'true'
        run: >-
          pnpm --filter @managemind/scripts exec tsx preview/workers.ts
          --pr "$PR" --hyperdrive ${{ steps.database.outputs.hyperdrive_id }} --commit "$COMMIT_SHA"

      # Previews' own keys when the secrets are missing: credentials and push
      # devices saved on a preview then last until its next push.
      - name: Preview keys
        id: keys
        if: steps.scope.outputs.deploy == 'true'
        run: pnpm --filter @managemind/scripts keys --outputs
      # Previews sign with their own secret. Without the AUTH_SECRET_PREVIEW
      # repository secret, each deploy makes a new one: preview sign-ins and
      # authenticator setups then last only until the next push.
      - name: Deploy the API
        if: steps.scope.outputs.deploy == 'true'
        env:
          AUTH_SECRET_PREVIEW: ${{ secrets.AUTH_SECRET_PREVIEW }}
          CREDENTIALS_KEY_PREVIEW: ${{ secrets.CREDENTIALS_KEY_PREVIEW }}
        run: |
          secrets="$RUNNER_TEMP/api-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          auth="${AUTH_SECRET_PREVIEW:-$(openssl rand -base64 32)}"
          credentials="${CREDENTIALS_KEY_PREVIEW:-${{ steps.keys.outputs.credentials_key }}}"
          # A new dev mailbox token per deploy; later steps (E2E) read it from the env.
          dev_token="$(openssl rand -hex 24)"
          echo "::add-mask::$dev_token"
          echo "DEV_TOKEN=$dev_token" >> "$GITHUB_ENV"
          # Turnstile runs with Cloudflare's published test keys, which always pass.
          (umask 077; jq -n --arg auth "$auth" --arg dev "$dev_token" --arg credentials "$credentials" \
            --arg vpub "${{ steps.keys.outputs.vapid_public }}" --arg vpriv "${{ steps.keys.outputs.vapid_private }}" \
            '{AUTH_SECRET: $auth, DEV_TOKEN: $dev, CREDENTIALS_KEY: $credentials,
              VAPID_PUBLIC_KEY: $vpub, VAPID_PRIVATE_KEY: $vpriv,
              TURNSTILE_SITE_KEY: "1x00000000000000000000AA",
              TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"}' > "$secrets")
          pnpm --filter @managemind/api exec wrangler deploy -c wrangler.preview.json \
            --secrets-file "$secrets"
      - name: Deploy the storefront
        id: deployed
        if: steps.scope.outputs.deploy == 'true'
        run: pnpm --filter @managemind/storefront exec wrangler deploy

      - name: Remove the PR's own database (label removed)
        if: steps.scope.outputs.deploy == 'true' && steps.choice.outputs.database == 'shared'
        run: pnpm --filter @managemind/scripts exec tsx preview/teardown.ts --pr "$PR" --database-only

      - run: pnpm --filter @managemind/e2e exec playwright install --with-deps chromium
        if: steps.scope.outputs.deploy == 'true'
      # The smoke tests. A full run adds the Phase 1 flows, the catalog flows
      # (Phase 2), the storefront and online-store flows (Phase 3), and the
      # shopper, orders and promotions flows (Phase 4), and the returns and
      # refunds flow (Phase 5A) at a phone and a desktop viewport with axe on
      # every screen (E2E_RUN and DEV_TOKEN are in the env).
      - name: Smoke test and E2E flows
        id: smoke
        if: steps.scope.outputs.deploy == 'true'
        env:
          API_URL: ${{ steps.workers.outputs.api_url }}
          STOREFRONT_URL: ${{ steps.workers.outputs.storefront_url }}
          FULL: ${{ steps.scope.outputs.full }}
        run: |
          echo "E2E_SINCE=$(date +%s%3N)" >> "$GITHUB_ENV"
          if [ "$FULL" = true ]; then
            pnpm --filter @managemind/e2e e2e
          else
            pnpm --filter @managemind/e2e e2e --project=smoke
          fi
      # ADR 0003's measurement on a full run: informational, never blocks.
      - name: CPU per route
        if: steps.scope.outputs.full == 'true' && steps.smoke.outcome == 'success'
        continue-on-error: true
        run: >-
          pnpm --filter @managemind/scripts exec tsx preview/cpu.ts --pr "$PR"
          --api-url "${{ steps.workers.outputs.api_url }}"
          --storefront-url "${{ steps.workers.outputs.storefront_url }}" --since "$E2E_SINCE"
      # Performance budgets (phase-3-plan §8): the demo stores' pages on a
      # phone over throttled 4G, three runs each, the median judged: LCP
      # 2.5 s, CLS 0.1, TBT 200 ms, accessibility 95, and SEO basics. Phase 4
      # adds the cart and checkout pages (phase-4-plan §9).
      # @lhci/cli runs from the registry at a pinned version, so installs
      # elsewhere never pull in Lighthouse and its Chrome tooling.
      - name: Lighthouse
        id: lighthouse
        if: steps.scope.outputs.full == 'true' && steps.smoke.outcome == 'success'
        env:
          STOREFRONT_URL: ${{ steps.workers.outputs.storefront_url }}
        run: |
          u="${STOREFRONT_URL%/}"
          pnpm dlx @lhci/cli@0.15.1 autorun --config=e2e/lighthouse/lighthouserc.json \
            --collect.url="$u/?store=demo-fashion" \
            --collect.url="$u/categories/sarees?store=demo-fashion" \
            --collect.url="$u/products/red-jamdani-saree?store=demo-fashion" \
            --collect.url="$u/?store=demo-grocery" \
            --collect.url="$u/cart?store=demo-grocery" \
            --collect.url="$u/checkout?store=demo-grocery"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        with:
          name: lighthouse-reports
          path: e2e/lighthouse/reports
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && steps.smoke.outcome == 'failure'
        with:
          name: playwright-traces
          path: e2e/test-results
          retention-days: 7

      - name: Comment the preview URLs
        if: ${{ !cancelled() && steps.choice.outcome == 'success' }}
        env:
          CHECKS: ${{ steps.scope.outputs.describe }}
        run: >-
          pnpm --filter @managemind/scripts exec tsx preview/comment.ts --pr "$PR"
          --status ${{ steps.deployed.outcome == 'success' && 'deployed' || 'failed' }}
          --api-url "${{ steps.workers.outputs.api_url }}"
          --storefront-url "${{ steps.workers.outputs.storefront_url }}"
          --database "${{ steps.choice.outputs.describe }}"
          --smoke ${{ steps.smoke.outcome == 'success' && 'passed' || 'failed' }}
          --checks "$CHECKS"
      - name: Comment that there is no preview
        if: ${{ !cancelled() && steps.scope.outputs.deploy == 'false' }}
        env:
          CHECKS: ${{ steps.scope.outputs.describe }}
        run: >-
          pnpm --filter @managemind/scripts exec tsx preview/comment.ts --pr "$PR"
          --status skipped --checks "$CHECKS"

  teardown:
    name: Remove the preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @managemind/scripts exec tsx preview/teardown.ts --pr "$PR"
      - run: pnpm --filter @managemind/scripts exec tsx preview/comment.ts --pr "$PR" --status removed
