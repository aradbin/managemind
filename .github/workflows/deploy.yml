# Deploys master to production after CI passes on it (phase-0-plan §8):
# provisioning and migrations, then the API, then the storefront, then a
# smoke test. Rollback: docs/runbooks/rollback.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # A manual redeploy of master's current head, without waiting for CI.
  workflow_dispatch:

# One production change at a time, never cancelled halfway.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.workers.outputs.api_url }}/health
    env:
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
      STORE_DOMAIN: ${{ vars.STORE_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT_SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=./apps/*

      - name: Provision and migrate
        id: provision
        run: pnpm --filter @managemind/scripts exec tsx production/provision.ts
      - name: Worker configs
        id: workers
        run: >-
          pnpm --filter @managemind/scripts exec tsx production/workers.ts
          --hyperdrive ${{ steps.provision.outputs.hyperdrive_id }} --commit "$COMMIT_SHA"

      - name: Deploy the API
        run: pnpm --filter @managemind/api exec wrangler deploy -c wrangler.production.json
      - name: Deploy the storefront
        run: pnpm --filter @managemind/storefront exec wrangler deploy

      - name: Smoke test
        env:
          API_URL: ${{ steps.workers.outputs.api_url }}
          STOREFRONT_URL: ${{ steps.workers.outputs.storefront_url }}
        run: |
          # The new version is live once /health reports this commit.
          for i in $(seq 1 30); do
            commit=$(curl -fsS "$API_URL/health" | jq -r .commit || true)
            [ "$commit" = "$COMMIT_SHA" ] && break
            sleep 4
          done
          if [ "$commit" != "$COMMIT_SHA" ]; then
            echo "::error::/health reports ${commit:-nothing}, expected $COMMIT_SHA"; exit 1
          fi
          curl -fsS "$API_URL/health/deep" | jq -e '.status == "ok"'
          # No stores are live yet, so the storefront answers 404 with its own page.
          status=$(curl -sS -o /dev/null -w '%{http_code}' "$STOREFRONT_URL/")
          case "$status" in 200|404) ;; *) echo "::error::storefront answered $status"; exit 1 ;; esac
          echo "### Deployed $COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $API_URL/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storefront: $STOREFRONT_URL" >> "$GITHUB_STEP_SUMMARY"
