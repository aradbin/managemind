# Deploys master to production after CI passes on it (phase-0-plan §8):
# provisioning and migrations, then the API, then the storefront, then a
# smoke test. Rollback: docs/runbooks/rollback.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # A manual redeploy of master's current head, without waiting for CI.
  workflow_dispatch:

# One production change at a time, never cancelled halfway.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.workers.outputs.api_url }}/health
    env:
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN }}
      STORE_DOMAIN: ${{ vars.STORE_DOMAIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT_SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sentry settings for the admin build
        run: |
          echo "VITE_SENTRY_DSN=$(jq -r .projects.admin.dsn scripts/sentry.json)" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_ENVIRONMENT=production" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_RELEASE=$COMMIT_SHA" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=./apps/*
        env:
          SENTRY_SOURCEMAPS: 1

      - name: Provision and migrate
        id: provision
        run: pnpm --filter @managemind/scripts exec tsx production/provision.ts
      - name: Worker configs
        id: workers
        run: >-
          pnpm --filter @managemind/scripts exec tsx production/workers.ts
          --hyperdrive ${{ steps.provision.outputs.hyperdrive_id }} --commit "$COMMIT_SHA"

      # The API is bundled first, so the source maps uploaded to Sentry match
      # the exact file that is deployed (scripts/production/sourcemaps.ts).
      - name: Bundle the API
        run: >-
          pnpm --filter @managemind/api exec wrangler deploy -c wrangler.production.json
          --dry-run --outdir dist/worker --upload-source-maps
      - name: Source maps to Sentry
        # Missing source maps only make stack traces harder to read.
        continue-on-error: true
        run: pnpm --filter @managemind/scripts exec tsx production/sourcemaps.ts --release "$COMMIT_SHA"
      - name: Keep source maps out of the admin's public files
        run: find apps/admin/dist -name '*.map' -delete

      # Secrets ship with the version, so the new code never runs without them.
      # AUTH_SECRET is the owner's (Q10): never regenerated here, because a new
      # one signs everyone out and makes stored TOTP secrets unreadable.
      - name: Deploy the API
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          : "${AUTH_SECRET:?the AUTH_SECRET repository secret is not set}"
          : "${RESEND_API_KEY:?the RESEND_API_KEY repository secret is not set}"
          secrets="$RUNNER_TEMP/api-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          (umask 077; jq -n --arg auth "$AUTH_SECRET" --arg resend "$RESEND_API_KEY" \
            '{AUTH_SECRET: $auth, RESEND_API_KEY: $resend}' > "$secrets")
          pnpm --filter @managemind/api exec wrangler deploy dist/worker/index.js --no-bundle \
            -c wrangler.production.json --secrets-file "$secrets"
      - name: Deploy the storefront
        run: pnpm --filter @managemind/storefront exec wrangler deploy

      - name: Smoke test
        env:
          API_URL: ${{ steps.workers.outputs.api_url }}
          STOREFRONT_URL: ${{ steps.workers.outputs.storefront_url }}
        run: |
          # A just-created workers.dev Worker is not on every edge at once: for
          # about a minute some requests get Cloudflare's own 404. Retry each
          # check for up to 2 minutes.
          retry() {
            for i in $(seq 1 30); do "$1" && return 0; sleep 4; done
            echo "::error::smoke check $1 failed"; return 1
          }
          # The new version is live once /health reports this commit.
          live() { [ "$(curl -fsS "$API_URL/health" | jq -r .commit)" = "$COMMIT_SHA" ]; }
          database() { curl -fsS "$API_URL/health/deep" | jq -e '.status == "ok"' > /dev/null; }
          # No stores are live yet, so the storefront answers its own 404 page
          # (Cloudflare's 404 is a short text/plain body).
          storefront() {
            body=$(curl -sS -w '\n%{http_code}' "$STOREFRONT_URL/")
            case "${body##*$'\n'}" in
              200) return 0 ;;
              404) grep -q 'Store not found' <<< "$body" ;;
              *) return 1 ;;
            esac
          }
          retry live
          retry database
          retry storefront
          echo "### Deployed $COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $API_URL/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storefront: $STOREFRONT_URL" >> "$GITHUB_STEP_SUMMARY"
