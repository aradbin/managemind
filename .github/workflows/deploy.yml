# Deploys master to production after CI passes on it (phase-0-plan §8):
# provisioning and migrations, then the API, then the storefront, then a
# smoke test. Rollback: docs/runbooks/rollback.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # A manual redeploy of master's current head, without waiting for CI.
  workflow_dispatch:

# One production change at a time, never cancelled halfway.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.workers.outputs.admin_url }}
    env:
      TURBO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Production's domains (phase-1-plan §10); repository variables override them.
      PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN || 'managemind.site' }}
      STORE_DOMAIN: ${{ vars.STORE_DOMAIN || 'managemind.store' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.COMMIT_SHA }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sentry settings for the admin build
        run: |
          echo "VITE_SENTRY_DSN=$(jq -r .projects.admin.dsn scripts/sentry.json)" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_ENVIRONMENT=production" >> "$GITHUB_ENV"
          echo "VITE_SENTRY_RELEASE=$COMMIT_SHA" >> "$GITHUB_ENV"
      - run: pnpm turbo run build --filter=./apps/*
        env:
          SENTRY_SOURCEMAPS: 1

      - name: Provision and migrate
        id: provision
        run: pnpm --filter @managemind/scripts exec tsx production/provision.ts
      - name: DNS and zone settings
        run: pnpm --filter @managemind/scripts exec tsx production/zones.ts
      - name: Worker configs
        id: workers
        run: >-
          pnpm --filter @managemind/scripts exec tsx production/workers.ts
          --hyperdrive ${{ steps.provision.outputs.hyperdrive_id }}
          --kv ${{ steps.provision.outputs.kv_id }} --commit "$COMMIT_SHA"

      # The API is bundled first, so the source maps uploaded to Sentry match
      # the exact file that is deployed (scripts/production/sourcemaps.ts).
      - name: Bundle the API
        run: >-
          pnpm --filter @managemind/api exec wrangler deploy -c wrangler.production.json
          --dry-run --outdir dist/worker --upload-source-maps
      - name: Source maps to Sentry
        # Missing source maps only make stack traces harder to read.
        continue-on-error: true
        run: pnpm --filter @managemind/scripts exec tsx production/sourcemaps.ts --release "$COMMIT_SHA"
      - name: Keep source maps out of the admin's public files
        run: find apps/admin/dist -name '*.map' -delete

      # Secrets ship with the version, so the new code never runs without them.
      # AUTH_SECRET is the owner's (Q10): never regenerated here, because a new
      # one signs everyone out and makes stored TOTP secrets unreadable.
      # CF_STORE_TOKEN (Cache Purge, and SSL and Certificates, on the store
      # zone) is optional until the owner adds it: without it pages are not
      # purged (they expire within a day) and custom domains can't be added.
      - name: Deploy the API
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CF_STORE_TOKEN: ${{ secrets.CF_STORE_TOKEN }}
        run: |
          : "${AUTH_SECRET:?the AUTH_SECRET repository secret is not set}"
          : "${RESEND_API_KEY:?the RESEND_API_KEY repository secret is not set}"
          if [ -z "$CF_STORE_TOKEN" ]; then
            echo "::warning title=CF_STORE_TOKEN::not set: store pages are not purged after changes, and custom domains are off"
          fi
          secrets="$RUNNER_TEMP/api-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          (umask 077; jq -n --arg auth "$AUTH_SECRET" --arg resend "$RESEND_API_KEY" --arg store "$CF_STORE_TOKEN" \
            '{AUTH_SECRET: $auth, RESEND_API_KEY: $resend} + (if $store == "" then {} else {CF_STORE_TOKEN: $store} end)' > "$secrets")
          pnpm --filter @managemind/api exec wrangler deploy dist/worker/index.js --no-bundle \
            -c wrangler.production.json --secrets-file "$secrets"
      - name: Deploy the storefront
        run: pnpm --filter @managemind/storefront exec wrangler deploy

      - name: Smoke test
        env:
          API_URL: ${{ steps.workers.outputs.api_url }}
          ADMIN_URL: ${{ steps.workers.outputs.admin_url }}
          STOREFRONT_URL: ${{ steps.workers.outputs.storefront_url }}
        run: |
          # A new Worker, route or custom domain is not on every edge at once,
          # and a new custom domain waits for its certificate: some requests get
          # Cloudflare's own errors for a few minutes. Retry each check for up
          # to 5 minutes.
          retry() {
            for i in $(seq 1 75); do "$1" && return 0; sleep 4; done
            echo "::error::smoke check $1 failed"; return 1
          }
          # The new version is live once /health reports this commit.
          live() { [ "$(curl -fsS "$API_URL/health" | jq -r .commit)" = "$COMMIT_SHA" ]; }
          database() { curl -fsS "$API_URL/health/deep" | jq -e '.status == "ok"' > /dev/null; }
          # The admin's shell from static assets, and the API under it.
          admin() {
            curl -fsS "$ADMIN_URL/" | grep -q '<div id="root">' &&
              [ "$(curl -sS -o /dev/null -w '%{http_code}' "$ADMIN_URL/api/admin/me")" = 401 ]
          }
          # A store address that doesn't exist answers the storefront's own 404
          # page (Cloudflare's 404 is a short text/plain body).
          storefront() {
            body=$(curl -sS -w '\n%{http_code}' "$STOREFRONT_URL/")
            case "${body##*$'\n'}" in
              200) return 0 ;;
              404) grep -q 'Store not found' <<< "$body" ;;
              *) return 1 ;;
            esac
          }
          retry live
          retry database
          retry admin
          retry storefront
          echo "### Deployed $COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Admin: $ADMIN_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $API_URL/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Storefront: $STOREFRONT_URL" >> "$GITHUB_STEP_SUMMARY"
