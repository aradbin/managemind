# Production resources by hand (phase-0-plan §8), then DNS and zone settings
# (phase-1-plan §10). deploy.yml runs the same idempotent scripts before
# every deploy; run this one to provision without deploying, or to rotate the
# mm_app password.
name: Provision

on:
  workflow_dispatch:
    inputs:
      rotate:
        description: Give mm_app a new password (Hyperdrive is updated to match)
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    name: Provision production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      PLATFORM_DOMAIN: ${{ vars.PLATFORM_DOMAIN || 'managemind.site' }}
      STORE_DOMAIN: ${{ vars.STORE_DOMAIN || 'managemind.store' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm --filter @managemind/scripts exec tsx production/provision.ts
          ${{ inputs.rotate && '--rotate' || '' }}
      - run: pnpm --filter @managemind/scripts exec tsx production/zones.ts
