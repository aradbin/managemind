# Production resources by hand (phase-0-plan §8). deploy.yml runs the same
# idempotent script before every deploy; run this one to provision without
# deploying, or to rotate the mm_app password.
name: Provision

on:
  workflow_dispatch:
    inputs:
      rotate:
        description: Give mm_app a new password (Hyperdrive is updated to match)
        type: boolean
        default: false

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    name: Provision production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm --filter @managemind/scripts exec tsx production/provision.ts
          ${{ inputs.rotate && '--rotate' || '' }}
