# Checks every pull request and every push to master (phase-0-plan §8).
# Previews and their Playwright smoke test run in preview.yml.
#
# Actions minutes (phase-5b-plan Q10): the repository is private on a free
# account, with 2,000 minutes a month for every workflow. So a change to docs
# only skips the checks (the jobs still pass, for branch protection), and
# turbo's cache is kept between runs for a week, so a package whose inputs
# didn't change isn't typechecked and tested again. Each week starts from an
# empty cache.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          # The server-level database the test helpers connect to first, as
          # the session hook creates it locally.
          POSTGRES_DB: managemind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Server-level URL as the migration role; each package's tests create
      # and rebuild their own database on it (ADR 0008).
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/managemind_test
      # The backup round trip (scripts/backup) needs Postgres 18's own tools:
      # the runner's client is older, and the service's image is already here.
      PG_DUMP: docker run --rm -i --network host postgres:18 pg_dump
      PG_RESTORE: docker run --rm -i --network host postgres:18 pg_restore
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The commit and its first parent: on a PR, the merge commit and the base.
          fetch-depth: 2
      - name: Docs only?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A push of more than one commit (never through a PR) is checked in full.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$BEFORE" != "$(git rev-parse HEAD^1)" ]; then
            echo "docs=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          docs=true
          for f in $(git diff --name-only HEAD^1 HEAD); do
            case "$f" in docs/*|*.md) ;; *) docs=false ;; esac
          done
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          [ "$docs" = true ] && echo "::notice::Only docs changed: the checks are skipped." || true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.changes.outputs.docs != 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.changes.outputs.docs != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.docs != 'true'
      - name: age, for the backup round trip
        if: steps.changes.outputs.docs != 'true'
        run: sudo apt-get install -y -qq age || (sudo apt-get update -qq && sudo apt-get install -y -qq age)
      - name: Week of the turbo cache
        if: steps.changes.outputs.docs != 'true'
        run: echo "TURBO_WEEK=$(date -u +%G-W%V)" >> "$GITHUB_ENV"
      # A PR reads the newest cache of its own branch, else master's; master
      # never reads a PR's. Renovate pins the digest (helpers:pinGitHubActionDigests).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.changes.outputs.docs != 'true'
        with:
          path: .turbo/cache
          key: turbo-check-${{ runner.os }}-${{ env.TURBO_WEEK }}-${{ github.sha }}
          restore-keys: turbo-check-${{ runner.os }}-${{ env.TURBO_WEEK }}-
      - name: Lint and format (Biome)
        if: steps.changes.outputs.docs != 'true'
        run: pnpm exec biome ci .
      - name: Migrations match the schema
        if: steps.changes.outputs.docs != 'true'
        run: |
          pnpm --filter @managemind/db exec drizzle-kit check
          pnpm --filter @managemind/db exec drizzle-kit generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            git status --porcelain packages/db/migrations
            echo "::error title=Migrations::schema changes without a migration; run pnpm --filter @managemind/db db:generate --name <change>"
            exit 1
          fi
      - name: SDK matches the API
        if: steps.changes.outputs.docs != 'true'
        run: |
          pnpm --filter @managemind/sdk generate
          if [ -n "$(git status --porcelain packages/sdk/src)" ]; then
            git diff --stat packages/sdk/src
            echo "::error title=SDK::routes changed without regenerating the SDK; run pnpm --filter @managemind/sdk generate"
            exit 1
          fi
      - name: Typecheck and test (unit, integration, isolation)
        if: steps.changes.outputs.docs != 'true'
        run: pnpm turbo run typecheck test
      - name: Dependency audit
        if: steps.changes.outputs.docs != 'true'
        run: pnpm audit --audit-level high

  build:
    name: Build and bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The commit and its first parent: on a PR, the merge commit and the base.
          fetch-depth: 2
      - name: Docs only?
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A push of more than one commit (never through a PR) is checked in full.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$BEFORE" != "$(git rev-parse HEAD^1)" ]; then
            echo "docs=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          docs=true
          for f in $(git diff --name-only HEAD^1 HEAD); do
            case "$f" in docs/*|*.md) ;; *) docs=false ;; esac
          done
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          [ "$docs" = true ] && echo "::notice::Only docs changed: the checks are skipped." || true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.changes.outputs.docs != 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.changes.outputs.docs != 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.changes.outputs.docs != 'true'
      - run: pnpm turbo run build --filter=./apps/*
        if: steps.changes.outputs.docs != 'true'
      - name: Bundle size (Workers 3 MiB gzip; admin initial JS 150 KiB gzip)
        if: steps.changes.outputs.docs != 'true'
        run: node scripts/bundle-size.mjs apps/api apps/storefront apps/admin
