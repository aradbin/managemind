# The nightly backup (phase-5b-plan §3.14, ADR 0028): a custom-format dump
# of production, straight from Neon with Postgres 18's client, encrypted with
# age to the public key in BACKUP_AGE_RECIPIENT, then uploaded to R2 under
# backups/daily/ (and backups/weekly/ on Sundays). The bucket's rules keep a
# week of daily and a month of weekly copies. The runner holds only the public
# key, so it can't read old backups. A failure fails the run, which emails the repository owner.
name: Backup

on:
  schedule:
    # 21:17 UTC is 03:17 in Dhaka, when stores are quiet.
    - cron: '17 21 * * *'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Dump, encrypt and upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: managemind-files
    steps:
      - name: Keys set?
        id: keys
        run: |
          if [ -z "$BACKUP_AGE_RECIPIENT" ]; then
            echo "::warning title=Backup::BACKUP_AGE_RECIPIENT (variable) is not set: no backup was made. See ADR 0028 for making the age key pair."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Postgres 18 client and age
        if: steps.keys.outputs.ready == 'true'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-18 age
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.keys.outputs.ready == 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.keys.outputs.ready == 'true'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.keys.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Dump and encrypt
        if: steps.keys.outputs.ready == 'true'
        run: |
          set -o pipefail
          dump="$RUNNER_TEMP/db.dump.age"
          # The plain dump is never written to disk: it goes straight into age.
          /usr/lib/postgresql/18/bin/pg_dump --format=custom --no-password \
            --dbname="$DATABASE_URL_MIGRATIONS" | age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" > "$dump"
          echo "DUMP=$dump" >> "$GITHUB_ENV"
      - name: Upload
        if: steps.keys.outputs.ready == 'true'
        run: pnpm --filter @managemind/scripts exec tsx backup/cli.ts upload --file "$DUMP"
