<style>

.mm{--background:oklch(1 0 0);--foreground:oklch(.145 0 0);--card:oklch(1 0 0);--popover:oklch(1 0 0);--primary:oklch(.205 0 0);--primary-foreground:oklch(.985 0 0);--secondary:oklch(.97 0 0);--secondary-foreground:oklch(.205 0 0);--muted:oklch(.97 0 0);--muted-foreground:oklch(.556 0 0);--accent:oklch(.97 0 0);--accent-foreground:oklch(.205 0 0);--destructive:oklch(.577 .245 27.325);--border:oklch(.922 0 0);--input:oklch(.922 0 0);--ring:oklch(.708 0 0);--sidebar-primary:oklch(.205 0 0);--sidebar-primary-foreground:oklch(.985 0 0);-webkit-font-smoothing:antialiased}

.mm :focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 50%,transparent)}
.mm-btn{display:inline-flex;flex:none;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;box-sizing:border-box;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--foreground);font:inherit;font-size:14px;font-weight:500;line-height:20px;white-space:nowrap;cursor:pointer}
.mm-btn:has(>svg){padding:0 12px}

.mm-icon,.mm-btn.mm-icon{width:36px;padding:0}
.mm-primary{background:var(--primary);color:var(--primary-foreground);box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}

.mm-outline:hover,.mm-ghost:hover{background:var(--accent);color:var(--accent-foreground)}
.mm-muted{color:var(--muted-foreground)}

.mm-combo{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:40px;padding:0 10px 0 12px;box-sizing:border-box;border:1px solid var(--input);border-radius:8px;background:transparent;color:var(--foreground);font:inherit;font-size:16px;font-weight:400;text-align:left;cursor:pointer;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.mm-label{display:block;margin:0 0 8px;font-size:14px;font-weight:500;line-height:1}

.mm-ptab[aria-current=page]{background:var(--background);color:var(--foreground);box-shadow:0 1px 3px 0 rgb(0 0 0 / .1),0 1px 2px -1px rgb(0 0 0 / .1)}

.mm-tab[aria-selected=true]{background:var(--background);color:var(--foreground);box-shadow:0 1px 3px 0 rgb(0 0 0 / .1),0 1px 2px -1px rgb(0 0 0 / .1)}
.mm.dark .mm-tab[aria-selected=true]{background:var(--input);border-color:var(--input)}
.mm-scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.mm-scroll>*{flex-shrink:0}
.mm-chip{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 2px 0 10px;border-radius:6px;background:var(--secondary);color:var(--secondary-foreground);font-size:13px;font-weight:500}
.mm-chip button{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;border:0;border-radius:4px;background:transparent;color:inherit;opacity:.6;cursor:pointer}
.mm-chipbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:40px;padding:5px 6px;box-sizing:border-box;border:1px solid var(--input);border-radius:8px;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}
.mm-addchip{height:28px;padding:0 8px;font-size:13px;color:var(--muted-foreground)}
.mm-more{display:flex;align-items:center;gap:6px;width:100%;min-height:40px;margin:-8px 0;padding:0;border:0;background:transparent;color:var(--muted-foreground);font:inherit;font-size:14px;font-weight:500;text-align:left;cursor:pointer}

.mm-row{position:relative;display:flex;align-items:center;gap:4px;min-height:56px;padding:6px 4px 6px 8px;border-bottom:1px solid var(--border)}
.mm-rows>li:last-child .mm-row{border-bottom:0}
.mm-row[data-current=true]{background:var(--muted)}
.mm-rowlink{display:flex;flex:1;flex-direction:column;min-width:0;padding:0;border:0;background:transparent;color:var(--foreground);font:inherit;text-align:left;cursor:pointer}
.mm-rowlink::after{content:"";position:absolute;inset:0}
.mm .mm-rowlink:focus-visible{box-shadow:none}

.mm-above{position:relative;z-index:1}
.mm-chev{display:inline-flex;flex:none;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--muted-foreground);cursor:pointer}
.mm-chev svg{transition:transform .15s}
.mm-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.mm-tabbar{display:flex;flex:none;height:64px;padding:0 4px;border-top:1px solid var(--border);background:var(--background)}
.mm-tabitem{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:0;border:0;background:transparent;color:var(--muted-foreground);font:inherit;font-size:11px;font-weight:500;line-height:14px;cursor:pointer}
.mm-tabitem[aria-current=page]{color:var(--foreground);font-weight:600}
.mm-pill{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:28px;border-radius:9999px}
.mm-tabitem[aria-current=page] .mm-pill{background:var(--muted)}
.mm-tabbadge{position:absolute;top:-4px;right:6px;display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:9999px;background:var(--destructive);color:#fff;font-size:10px;font-weight:600}
.mm-layer{position:absolute;inset:0;z-index:50}
.mm-scrim{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:rgb(0 0 0 / .5);cursor:default}
.mm-drawer{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-height:85%;border-top:1px solid var(--border);border-radius:10px 10px 0 0;background:var(--background);color:var(--foreground)}
.mm-handle{flex:none;width:100px;height:8px;margin:16px auto 0;border-radius:9999px;background:var(--muted)}
.mm-dhead{flex:none;padding:12px 16px 8px;text-align:center}
.mm-dtitle{margin:0;font-size:16px;line-height:24px;font-weight:600}
.mm-optrow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 12px;box-sizing:border-box;border:0;border-radius:8px;background:transparent;color:var(--foreground);font:inherit;font-size:15px;text-align:left;cursor:pointer}
.mm-optrow svg{flex:none;color:var(--muted-foreground)}
.mm-optrow:hover{background:var(--accent)}

.mm{--success:oklch(.723 .219 149.579);--page:oklch(.985 0 0)}
.mm.dark{--success:oklch(.792 .209 151.711);--page:oklch(.145 0 0)}
.mm-row{gap:12px;min-height:64px;padding:8px 4px 8px 12px}
.mm-av{display:inline-flex;flex:none;align-items:center;justify-content:center;width:40px;height:40px;border-radius:9999px;background:var(--muted);color:var(--foreground);font-size:13px;font-weight:600}
.mm-flag{display:inline-flex;flex:none;align-items:center;height:20px;padding:0 6px;border-radius:6px;background:color-mix(in oklch,var(--destructive) 12%,transparent);color:var(--destructive);font-size:12px;font-weight:500}
.mm-tagchip{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:0;border-radius:6px;background:var(--secondary);color:var(--secondary-foreground);font:inherit;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
.mm-tagchip[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}
.mm-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.mm-badge{display:inline-flex;flex:none;align-items:center;padding:1px 6px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:500;line-height:16px;color:var(--muted-foreground);white-space:nowrap}

.mm-statrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0;border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden}
.mm-statrow>div{display:flex;flex-direction:column;gap:4px;padding:12px 16px}

.mm-statrow dt{font-size:12px;font-weight:500;color:var(--muted-foreground)}

.mm-orow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:10px 16px;border-bottom:1px solid var(--border)}

.mm-num{text-align:right;font-variant-numeric:tabular-nums}
.mm-dotlabel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-foreground);white-space:nowrap}
.mm-dotlabel>span{width:8px;height:8px;border-radius:9999px}

.mm-addr{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:10px}
.mm-alert{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:13px;line-height:18px}
.mm-alert>svg{flex:none;margin-top:1px}
.mm-alert-bad{color:var(--destructive);border-color:color-mix(in oklch,var(--destructive) 30%,transparent);background:color-mix(in oklch,var(--destructive) 5%,transparent)}
.mm-err{color:var(--destructive) !important}
.mm-chipbox input{flex:1;min-width:100px;height:28px;padding:0 4px;border:0;outline:none;background:transparent;color:var(--foreground);font:inherit;font-size:16px}
.mm-chipbox input::placeholder{color:var(--muted-foreground)}
.mm .mm-chipbox input:focus-visible{box-shadow:none}
.mm-switch{display:inline-flex;flex:none;align-items:center;width:32px;height:18px;padding:0 1px;box-sizing:border-box;border:0;border-radius:9999px;cursor:pointer;box-shadow:0 1px 2px 0 rgb(0 0 0 / .05);transition:background .15s}

.mm-knob{display:block;width:16px;height:16px;border-radius:9999px;background:var(--background);transition:transform .15s}

.mm-radio{display:inline-flex;flex:none;align-items:center;justify-content:center;width:18px;height:18px;padding:0;box-sizing:border-box;border:1px solid var(--input);border-radius:9999px;background:var(--background);cursor:pointer}
.mm-radio[aria-checked=true]{border-color:var(--primary)}
.mm-dot{width:8px;height:8px;border-radius:9999px;background:var(--primary)}
.mm-combo:disabled{opacity:.5;cursor:not-allowed}
.mm-alertbox{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:16px;padding:24px;border:1px solid var(--border);border-radius:10px;background:var(--background);color:var(--foreground);box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1)}

.mm{--warn:oklch(.666 .179 58.318)}
.mm.dark{--warn:oklch(.769 .188 70.08)}
.mm-tabcount{font-size:12px;font-weight:500;color:var(--muted-foreground);font-variant-numeric:tabular-nums}

.mm-sum>svg{flex:none;margin-top:2px;color:var(--muted-foreground)}
.mm-affix{position:relative;display:block;min-width:0}

.mm-affix>.mm-input{padding-left:28px}

.mm-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mm-rcard{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px;box-sizing:border-box;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--foreground);font:inherit;text-align:left;cursor:pointer}

.mm-rule{display:flex;padding:12px;border:1px solid var(--border);border-radius:10px}

.mm-chipbox{min-height:40px}

.mm-checkrow{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;cursor:pointer}

.mm-collapse{display:flex;align-items:flex-start;gap:12px;width:100%;padding:0;border:0;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}

.mm-totals .mm-total dt{color:var(--foreground)}
.mm-stepper{display:inline-flex;flex:none;align-items:center;height:32px;border:1px solid var(--input);border-radius:8px;overflow:hidden}
.mm-stepper button{width:32px;height:100%;padding:0;border:0;background:transparent;color:inherit;font:inherit;font-size:18px;cursor:pointer}

.mm-prow{display:flex;align-items:center;border-bottom:1px solid var(--border)}
.mm-rowlink{gap:2px}
.mm-statrow dd{font-size:16px}

    if (c.type === 'zones' && c.ids && c.ids.length) parts.push('delivery zone: ' + c.ids.map(function (z) { return ZONES.filter(function (x) { return x[0] === z; })[0][1]; }).join(', '));
    if (c.type === 'first_order') parts.push('first orders only');
    if (c.type === 'tags' && c.tags && c.tags.length) parts.push('for customers tagged ' + c.tags.join(', '));
    if (c.type === 'phones') { var n = String(c.text || '').split(/\n/).filter(function (x) { return x.trim(); }).length; if (n) parts.push('for ' + plural(n, 'chosen phone', 'chosen phones')); }
    if (c.type === 'payment' && c.methods && c.methods.length) parts.push(c.methods.length === 1 && c.methods[0] === 'cod' ? 'paying cash on delivery' : c.methods.indexOf('cod') === -1 ? 'paying in advance' : 'paying by ' + c.methods.map(function (m) { return PAYMENTS.filter(function (x) { return x[0] === m; })[0][1].toLowerCase(); }).join(' or '));

var START = { List: {}, 'Live only': { st: 'live' }, 'Type filter': { pop: 'kind' }, 'Row menu': { menu: 'eid' }, 'End now': { confirm: 'flash' } };

class Component extends DCLogic {
  renderVals() {
    var self = this;
    var startKey = this.props.startOn ?? 'List';
    var s = this.state || {};

    var up = function (patch) { self.setState(Object.assign({}, s, patch, { started: startKey })); };
    var toast = function (text) {
      clearTimeout(self.toastTimer);
      self.toastTimer = setTimeout(function () { self.setState({ toast: null }); }, 4000);
      return text;
    };
    var vals = {};
    var promos = s.promos || PROMOS;
    var setP = function (id, patch, text) {
      up({ promos: promos.map(function (p) { return p.id === id ? Object.assign({}, p, patch) : p; }), menu: null, confirm: null, toast: toast(text) });
    };
    var q = (s.q || '').trim().toLowerCase();
    var st = s.st || 'all';
    var kinds = s.kinds || [];
    vals.q = s.q || '';
    vals.onQ = function (e) { up({ q: e.target.value }); };
    var base = promos.filter(function (p) {
      return (!kinds.length || kinds.indexOf(p.kind) !== -1) && (!q || title(p).toLowerCase().indexOf(q) !== -1 || p.titleBn.indexOf(q) !== -1 || (p.code && p.code.toLowerCase().indexOf(q) !== -1));
    });
    vals.stTabs = [['all', 'All'], ['live', 'Live'], ['scheduled', 'Scheduled'], ['draft', 'Draft'], ['paused', 'Paused'], ['ended', 'Ended']].map(function (t) {
      var n = t[0] === 'all' ? base.length : base.filter(function (p) { return stateOf(p) === t[0]; }).length;
      return { label: t[1], count: String(n), on: st === t[0] ? 'true' : 'false', pick: function () { up({ st: t[0] }); } };
    });
    var list = base.filter(function (p) { return st === 'all' || stateOf(p) === st; });
    var rowOf = function (p) {

      var menuOpen = s.menu === p.id;
      var limit = num(p.usageLimit);
      return {
        title: title(p), isCode: p.kind === 'code', isAuto: p.kind !== 'code',
        code: p.code ? p.code : '', hasCode: Boolean(p.code), codes: p.code ? '' : plural(p.codeCount, 'code', 'codes'), noShared: p.kind === 'code' && !p.code,
        what: actionText(p),
        state: ss.label, sBg: ss.bg, sFg: ss.fg, sEdge: ss.edge || 'transparent',
        uses: limit ? p.uses.toLocaleString('en-US') + ' / ' + limit.toLocaleString('en-US') : p.uses.toLocaleString('en-US'),
        usePct: limit ? Math.min(100, Math.round(p.uses / limit * 100)) + '%' : '0%', hasLimit: Boolean(limit),
        orders: p.orders.toLocaleString('en-US'), discount: p.discount ? money(p.discount) : '—', sales: p.sales ? money(p.sales) : '—',
        dates: p.startsAt && p.endsAt ? day(p.startsAt) + ' – ' + day(p.endsAt) : p.startsAt ? 'From ' + day(p.startsAt) : p.endsAt ? 'Until ' + day(p.endsAt) : 'No end date',
        meta: (p.kind === 'code' ? (p.code ? p.code : plural(p.codeCount, 'code', 'codes')) : 'Automatic') + ' · ' + actionText(p),
        stats: p.uses ? plural(p.uses, 'use', 'uses') + ' · ' + money(p.discount) + ' off' : 'Not used yet',
        menuOpen: menuOpen, menuExpanded: menuOpen ? 'true' : 'false', menuAria: 'Actions for ' + title(p),
        toggleMenu: function () { up({ menu: menuOpen ? null : p.id }); },
        canCopy: Boolean(p.code), copyCode: function () { setP(p.id, {}, 'Code ' + p.code + ' copied.'); },
        canPause: state === 'live' || state === 'scheduled', pause: function () { setP(p.id, { status: 'paused' }, title(p) + ' is paused.'); },
        canResume: state === 'paused', resume: function () { setP(p.id, { status: 'active' }, title(p) + ' is live again.'); },
        canActivate: state === 'draft', activate: function () { setP(p.id, { status: 'active' }, title(p) + ' is active.'); },

    vals.emptyReset = function () { up({ q: '', kinds: [], st: 'all' }); };
    var mp = s.menu ? promos.filter(function (p) { return p.id === s.menu; })[0] : null;
    vals.menuOpen = Boolean(mp);
    vals.mp = rowOf(mp || promos[0]);

    var kq = kOpen ? (s.kq || '') : '';
    var kShown = [['automatic', 'Automatic'], ['code', 'Code']].filter(function (k) { return !kq.trim() || k[1].toLowerCase().indexOf(kq.trim().toLowerCase()) !== -1; });
    vals.kf = {
      open: kOpen, aria: kOpen ? 'true' : 'false', toggle: function () { up({ pop: kOpen ? null : 'kind', kq: '' }); },
      query: kq, onQuery: function (e) { up({ kq: e.target.value }); }, none: kShown.length === 0,
      has: kinds.length > 0, label: kinds.length === 1 ? (kinds[0] === 'code' ? 'Code' : 'Automatic') : '2 selected',
      count: String(kinds.length), buttonText: kinds.length === 1 ? (kinds[0] === 'code' ? 'Code' : 'Automatic') : 'Type',
      items: kShown.map(function (k) {
        var on = kinds.indexOf(k[0]) !== -1;
        return {
          label: k[1], on: on, aria: on ? 'true' : 'false', box: on ? 'var(--primary)' : 'transparent', edge: on ? 'var(--primary)' : 'var(--input)',
          count: String(promos.filter(function (p) { return p.kind === k[0]; }).length),
          toggle: function () { up({ kinds: on ? kinds.filter(function (x) { return x !== k[0]; }) : kinds.concat([k[0]]) }); }
        };

      clear: function () { up({ kinds: [], pop: null }); }
    };
    vals.hasFilters = Boolean(q || kinds.length);
    vals.clearAll = function () { up({ q: '', kinds: [] }); };

    var ep = s.confirm ? promos.filter(function (p) { return p.id === s.confirm; })[0] : null;
    vals.confirmOpen = Boolean(ep);
    vals.confirmTitle = ep ? 'End ' + title(ep) + '?' : '';
    vals.confirmText = 'It stops applying now. Orders that used it keep their discount, and its numbers stay here.';
    vals.doEnd = function () { setP(ep.id, { status: 'ended' }, title(ep) + ' has ended.'); };
    vals.cancelConfirm = function () { up({ confirm: null }); };

    var reset = { menu: null, pop: null, confirm: null };
    vals.closeAll = function () { up(reset); };
    vals.escClose = function (e) { if (e.key === 'Escape') { e.preventDefault(); up(reset); } };
    vals.hasToast = Boolean(s.toast);
    vals.toastText = s.toast || '';

    var dark = typeof s.dark === 'boolean' ? s.dark : (this.props.dark ?? false);
    vals.themeClass = ROOT + (dark ? ' dark' : '');
    vals.fontStack = FONTS[this.props.font ?? 'Inter'] || FONTS.Inter;
    vals.isDark = dark;
    vals.isLight = !dark;

    vals.toggleTheme = function () { up({ dark: !dark }); };
    return vals;
  }
}
