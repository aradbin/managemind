<div class="{{themeClass}}" style="position: relative; display: flex; flex-direction: column; width: 390px; height: 844px; overflow: hidden; background: var(--background); color: var(--foreground); font-family: {{fontStack}}; font-size: 14px; line-height: 20px">

<header style="display: flex; flex: none; align-items: center; gap: 8px; height: 56px; padding: 0 12px; border-bottom: 1px solid var(--border)">
<button type="button" class="mm-btn mm-ghost" style="flex: 1; min-width: 0; justify-content: flex-start; gap: 8px; padding: 0 8px 0 4px">
<span aria-hidden="true" style="display: inline-flex; flex: none; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; background: var(--sidebar-primary); color: var(--sidebar-primary-foreground); font-weight: 600">m</span>
<span class="mm-trunc" style="font-weight: 600">Nakshi Fashion</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; opacity: .5"><path d="m7 15 5 5 5-5"></path><path d="m7 9 5-5 5 5"></path></svg>
</button>
<button type="button" class="mm-btn mm-outline mm-icon" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
<button type="button" class="mm-btn mm-outline mm-icon" aria-label="Create"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
</header>

<main class="mm-scroll" style="gap: 12px; padding: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em">Promotions</h1>
<a href="PromotionPhone.dc.html" class="mm-btn mm-primary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>New promotion</a>
</div>

<div style="display: flex; gap: 8px">
<div style="position: relative; flex: 1; min-width: 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; top: 12px; color: var(--muted-foreground); pointer-events: none"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="search" class="mm-input" aria-label="Search by title or code" placeholder="Title or code" value="{{q}}" onChange="{{onQ}}" style="padding-left: 36px">
</div>
<button type="button" class="mm-btn mm-outline" aria-haspopup="dialog" onClick="{{kf.toggle}}" style="height: 40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M7 12h10"></path><path d="M10 18h4"></path></svg>{{kf.buttonText}}</button>
</div>

<nav aria-label="State" style="margin: 0 -16px; padding: 0 16px; overflow-x: auto; scrollbar-width: none">
<div role="tablist" class="mm-tabs" style="height: 40px">
<sc-for list="{{stTabs}}" as="t" hint-placeholder-count="6"><button type="button" role="tab" class="mm-tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 34px; gap: 6px; padding: 0 12px">{{t.label}}<span class="mm-tabcount">{{t.count}}</span></button></sc-for>
</div>
</nav>

<div style="border: 1px solid var(--border); border-radius: 10px; overflow: hidden">
<ul class="mm-rows" aria-label="Promotions" style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<li><div class="mm-row" style="align-items: flex-start; padding-top: 12px; padding-bottom: 12px">
<a href="PromotionPhone.dc.html" class="mm-rowlink" style="gap: 4px">
<span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span class="mm-trunc" style="font-weight: 500">{{r.title}}</span><span class="mm-sbadge" style="background: {{r.sBg}}; color: {{r.sFg}}; box-shadow: inset 0 0 0 1px {{r.sEdge}}">{{r.state}}</span></span>
<span class="mm-trunc mm-muted" style="font-size: 13px; line-height: 18px">{{r.meta}}</span>
<span class="mm-muted" style="font-size: 12px; line-height: 16px">{{r.stats}}</span>
</a>
<button type="button" class="mm-btn mm-ghost mm-icon mm-above" aria-label="{{r.menuAria}}" aria-haspopup="dialog" onClick="{{r.toggleMenu}}" style="margin-top: -4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
</div></li>
</sc-for>
</ul>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 16px; text-align: center"><p class="mm-muted" style="margin: 0">{{emptyText}}</p><sc-if value="{{emptyCanReset}}" hint-placeholder-val="{{true}}"><button type="button" class="mm-btn mm-outline" onClick="{{emptyReset}}">Reset filters</button></sc-if></div></sc-if>
</div>
</main>

<nav aria-label="Main" class="mm-tabbar">
<a href="#" class="mm-tabitem"><span class="mm-pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>Home</a>
<a href="#" class="mm-tabitem"><span class="mm-pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span class="mm-tabbadge">4<span class="mm-sr"> to confirm</span></span></span>Orders</a>
<a href="Phone.dc.html" class="mm-tabitem"><span class="mm-pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"></path><path d="M12 22V12"></path><path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7"></path><path d="m7.5 4.27 9 5.15"></path></svg></span>Products</a>
<a href="CustomersPhone.dc.html" class="mm-tabitem"><span class="mm-pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>Customers</a>
<a href="#" class="mm-tabitem" aria-current="page"><span class="mm-pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg></span>Menu</a>
</nav>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div class="mm-layer">
<button type="button" tabindex="-1" class="mm-scrim" aria-label="Close" onClick="{{closeAll}}"></button>
<div role="dialog" aria-modal="true" aria-labelledby="mm-mp-title" class="mm-drawer" onKeyDown="{{escClose}}">
<div class="mm-handle" aria-hidden="true"></div>
<div class="mm-dhead"><h2 id="mm-mp-title" class="mm-dtitle">{{mp.title}}</h2><p class="mm-muted" style="margin: 2px 0 0; font-size: 13px">{{mp.meta}}</p></div>
<div role="menu" aria-labelledby="mm-mp-title" style="display: flex; flex-direction: column; padding: 4px 8px 24px">
<a href="PromotionPhone.dc.html" role="menuitem" class="mm-optrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg>Edit</a>
<sc-if value="{{mp.canCopy}}" hint-placeholder-val="{{true}}"><button type="button" role="menuitem" class="mm-optrow" onClick="{{mp.copyCode}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>Copy code</button></sc-if>
<sc-if value="{{mp.canActivate}}" hint-placeholder-val="{{false}}"><button type="button" role="menuitem" class="mm-optrow" onClick="{{mp.activate}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg>Activate</button></sc-if>
<sc-if value="{{mp.canPause}}" hint-placeholder-val="{{true}}"><button type="button" role="menuitem" class="mm-optrow" onClick="{{mp.pause}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg>Pause</button></sc-if>
<sc-if value="{{mp.canResume}}" hint-placeholder-val="{{false}}"><button type="button" role="menuitem" class="mm-optrow" onClick="{{mp.resume}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"></path></svg>Resume</button></sc-if>
<sc-if value="{{mp.canEnd}}" hint-placeholder-val="{{true}}"><div role="separator" class="mm-sep"></div><button type="button" role="menuitem" class="mm-optrow mm-danger" onClick="{{mp.askEnd}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><rect x="9" y="9" width="6" height="6" rx="1"></rect></svg>End now</button></sc-if>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{kf.open}}" hint-placeholder-val="{{false}}">
<div class="mm-layer">
<button type="button" tabindex="-1" class="mm-scrim" aria-label="Close" onClick="{{closeAll}}"></button>
<div role="dialog" aria-modal="true" aria-labelledby="mm-kf-title" class="mm-drawer" onKeyDown="{{escClose}}">
<div class="mm-handle" aria-hidden="true"></div>
<div class="mm-dhead"><h2 id="mm-kf-title" class="mm-dtitle">Type</h2></div>
<div style="flex: none; position: relative; padding: 0 16px 8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 28px; top: 12px; color: var(--muted-foreground); pointer-events: none"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="search" class="mm-input" aria-label="Find a type" placeholder="Type" autoComplete="off" value="{{kf.query}}" onChange="{{kf.onQuery}}" style="padding-left: 36px">
</div>
<div role="listbox" aria-multiselectable="true" aria-labelledby="mm-kf-title" style="display: flex; flex-direction: column; padding: 4px 8px 8px">
<sc-for list="{{kf.items}}" as="o" hint-placeholder-count="2"><button type="button" role="option" aria-selected="{{o.aria}}" class="mm-optrow" onClick="{{o.toggle}}"><span class="mm-fbox" style="background: {{o.box}}; border-color: {{o.edge}}"><sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--primary-foreground)"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span><span style="flex: 1">{{o.label}}</span><span class="mm-code mm-muted">{{o.count}}</span></button></sc-for><sc-if value="{{kf.none}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 20px 0; text-align: center; color: var(--muted-foreground)">No type found.</p></sc-if>
</div>
<div style="flex: none; display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border)"><button type="button" class="mm-btn mm-outline" style="flex: 1" onClick="{{kf.clear}}">Clear</button><button type="button" class="mm-btn mm-primary" style="flex: 2" onClick="{{closeAll}}">Done</button></div>
</div>
</div>
</sc-if>

<sc-if value="{{confirmOpen}}" hint-placeholder-val="{{false}}">
<div class="mm-layer" style="z-index: 70">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgb(0 0 0 / .5)"></div>
<div role="alertdialog" aria-modal="true" aria-labelledby="mm-al-title" aria-describedby="mm-al-desc" onKeyDown="{{escClose}}" class="mm-alertbox">
<div style="display: flex; flex-direction: column; gap: 8px; text-align: center"><h2 id="mm-al-title" style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">{{confirmTitle}}</h2><p id="mm-al-desc" style="margin: 0; color: var(--muted-foreground)">{{confirmText}}</p></div>
<div style="display: flex; flex-direction: column; gap: 8px"><button type="button" class="mm-btn" style="width: 100%; background: var(--destructive); color: #fff" onClick="{{doEnd}}">End now</button><button type="button" class="mm-btn mm-outline" style="width: 100%" onClick="{{cancelConfirm}}">Cancel</button></div>
</div>
</div>
</sc-if>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" class="mm-toast" style="bottom: 76px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg><span style="font-weight: 500">{{toastText}}</span></div>
</sc-if>

</div>
</x-dc>
