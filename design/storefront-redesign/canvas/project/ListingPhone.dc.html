<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category listing, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#1f4e8c}a:hover{color:#173c6d}
</style>
</helmet>
<div style="width: 390px; min-height: 6000px; position: relative; display: flex; flex-direction: column; font-family: 'Hind Siliguri', system-ui, sans-serif; color: #1a1f29; background: #ffffff; font-size: 15px; line-height: 1.5">
<dc-import name="PhoneHeader" primary="{{primary}}" cart-count="{{cartCount}}" back="HomePhone.dc.html" hint-size="100%,132px"></dc-import>

<main id="lp-top" style="flex: 1 1 auto; display: flex; flex-direction: column">
<div style="padding: 12px 16px 0">
<nav aria-label="Breadcrumb" style="font-size: 13px; color: #545b69">
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
<li><a href="HomePhone.dc.html" style="color: #545b69">Home</a></li>
<li aria-hidden="true">/</li>
<li aria-current="page" style="color: #1a1f29">Kitchen &amp; dining</li>
</ol>
</nav>
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-top: 6px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.25">Kitchen &amp; dining</h1>
<span role="status" style="color: #545b69; font-size: 14px">{{countText}}</span>
</div>
</div>

<nav aria-label="Shop by category" style="margin-top: 12px; display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 4px">
<sc-for list="{{subcats}}" as="c" hint-placeholder-count="5">
<a href="#" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #c5ccd8; display: flex; align-items: center; color: #1a1f29; text-decoration: none; font-weight: 500; font-size: 14px; box-sizing: border-box">{{c.name}}</a>
</sc-for>
</nav>

<div style="position: sticky; top: 0; z-index: 5; margin-top: 12px; padding: 8px 16px; background: #ffffff; border-top: 1px solid #dde2ea; border-bottom: 1px solid #dde2ea; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" onClick="{{openFilters}}" aria-haspopup="dialog" style="height: 44px; border: 1.5px solid #c5ccd8; border-radius: 8px; background: #ffffff; color: #1a1f29; font: inherit; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>{{filterLabel}}</button>
<button type="button" onClick="{{openSort}}" aria-haspopup="dialog" style="height: 44px; border: 1.5px solid #c5ccd8; border-radius: 8px; background: #ffffff; color: #1a1f29; font: inherit; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"></path></svg>{{sortShort}}</button>
</div>

<div role="group" aria-label="Quick filters" style="display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 0">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
<button type="button" onClick="{{q.toggle}}" aria-pressed="{{q.on}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: {{q.border}}; background: {{q.bg}}; color: #1a1f29; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">{{q.label}}<span style="color: #545b69; font-size: 13px">{{q.n}}</span></button>
</sc-for>
</div>

<sc-if value="{{hasApplied}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 0; align-items: center">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="1">
<button type="button" onClick="{{c.remove}}" aria-label="Remove filter: {{c.label}}" style="flex: none; height: 44px; padding: 0 12px 0 16px; border: 0; border-radius: 22px; background: #e8f0fa; color: #1a1f29; font: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">{{c.label}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-for>
<button type="button" onClick="{{clearAll}}" style="flex: none; height: 44px; padding: 0 8px; border: 0; background: transparent; color: {{primary}}; font: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer">Clear all</button>
</div>
</sc-if>

<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 40px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px">
<strong style="font-size: 17px">No products match these filters.</strong>
<span style="color: #3c4350; font-size: 14px">Try removing one of them:</span>
<sc-for list="{{suggestions}}" as="g" hint-placeholder-count="2">
<button type="button" onClick="{{g.apply}}" style="width: 100%; height: 48px; border: 1.5px solid {{primary}}; border-radius: 8px; background: #ffffff; color: {{primary}}; font: inherit; font-weight: 600; cursor: pointer">{{g.label}}</button>
</sc-for>
<button type="button" onClick="{{clearAll}}" style="width: 100%; height: 48px; border: 0; border-radius: 8px; background: {{primary}}; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer">Clear all filters</button>
</div>
</sc-if>

<div style="padding: 16px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px">
<sc-for list="{{products}}" as="p" hint-placeholder-count="24">
<dc-import name="ProductCard" item="{{p}}" added="{{p.added}}" compact="{{ true }}" on-add="{{addOne}}" on-choose="{{choose}}" primary="{{primary}}" hint-size="100%,380px"></dc-import>
</sc-for>
</div>

<sc-if value="{{noApplied}}" hint-placeholder-val="{{ true }}">
<div style="padding: 28px 16px 32px; display: flex; flex-direction: column; align-items: center; gap: 10px">
<span role="status" style="color: #545b69; font-size: 14px">{{shownText}}</span>
<span aria-hidden="true" style="display: block; width: 200px; height: 4px; border-radius: 2px; background: #dde2ea; overflow: hidden"><span style="display: block; height: 4px; width: {{progress}}; background: {{primary}}"></span></span>
<sc-if value="{{canLoadMore}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{loadMore}}" style="width: 100%; height: 48px; border: 1.5px solid #c5ccd8; border-radius: 8px; background: #ffffff; color: #1a1f29; font: inherit; font-weight: 600; cursor: pointer">Load 24 more products</button></sc-if>
</div>
</sc-if>
<sc-if value="{{hasApplied}}" hint-placeholder-val="{{ false }}"><div style="height: 32px"></div></sc-if>
</main>

<dc-import name="PhoneFooter" primary="{{primary}}" hint-size="100%,540px"></dc-import>

<sc-if value="{{showTop}}" hint-placeholder-val="{{ false }}">
<a href="#lp-top" aria-label="Back to top" style="position: fixed; right: 16px; bottom: 20px; z-index: 6; width: 52px; height: 52px; border-radius: 26px; background: #ffffff; border: 1px solid #c5ccd8; box-shadow: 0 6px 20px rgba(26,31,41,0.16); color: #1a1f29; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></a>
</sc-if>

<sc-if value="{{filtersOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; background: rgba(26,31,41,0.5); display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-modal="true" aria-labelledby="f-h" style="max-height: 88%; background: #ffffff; border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 20px; border-bottom: 1px solid #dde2ea">
<h2 id="f-h" style="flex: 1 1 auto; margin: 0; font-size: 18px; font-weight: 700">Filters</h2>
<sc-if value="{{hasApplied}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{clearAll}}" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: {{primary}}; font: inherit; font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer">Clear all</button></sc-if>
<button type="button" onClick="{{closeSheets}}" aria-label="Close filters" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1a1f29; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="flex: 1 1 auto; overflow-y: auto; padding: 12px 20px; display: flex; flex-direction: column; gap: 16px">
<fieldset style="margin: 0; padding: 0 0 12px; border: 0; border-bottom: 1px solid #dde2ea; display: flex; flex-direction: column">
<legend style="padding: 0; font-weight: 600; margin-bottom: 4px">Price</legend>
<sc-for list="{{priceOpts}}" as="o" hint-placeholder-count="5">
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: {{o.color}}"><input type="radio" name="m-price" checked="{{o.on}}" disabled="{{o.disabled}}" onChange="{{o.pick}}" style="width: 22px; height: 22px; margin: 0; accent-color: {{primary}}"><span style="flex: 1 1 auto">{{o.label}}</span><span style="color: {{o.countColor}}; font-size: 13px">{{o.n}}</span></label>
</sc-for>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 6px">
<label for="m-pmin" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Lowest price</label>
<input id="m-pmin" type="number" inputmode="numeric" placeholder="৳ Min" value="{{minDraft}}" onChange="{{setMinDraft}}" style="flex: 1 1 0; min-width: 0; height: 44px; padding: 0 10px; font: inherit; font-size: 16px; border: 1.5px solid #c5ccd8; border-radius: 8px; box-sizing: border-box">
<span aria-hidden="true" style="color: #545b69">–</span>
<label for="m-pmax" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Highest price</label>
<input id="m-pmax" type="number" inputmode="numeric" placeholder="৳ Max" value="{{maxDraft}}" onChange="{{setMaxDraft}}" style="flex: 1 1 0; min-width: 0; height: 44px; padding: 0 10px; font: inherit; font-size: 16px; border: 1.5px solid #c5ccd8; border-radius: 8px; box-sizing: border-box">
<button type="button" onClick="{{applyCustom}}" style="height: 44px; padding: 0 12px; border: 1.5px solid #c5ccd8; border-radius: 8px; background: #ffffff; color: #1a1f29; font: inherit; font-weight: 600; cursor: pointer">Go</button>
</div>
</fieldset>
<fieldset style="margin: 0; padding: 0 0 12px; border: 0; border-bottom: 1px solid #dde2ea; display: flex; flex-direction: column">
<legend style="padding: 0; font-weight: 600; margin-bottom: 4px">Availability</legend>
<sc-for list="{{avail}}" as="b" hint-placeholder-count="2">
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: {{b.color}}"><input type="checkbox" checked="{{b.on}}" disabled="{{b.disabled}}" onChange="{{b.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: {{primary}}"><span style="flex: 1 1 auto">{{b.name}}</span><span style="color: {{b.countColor}}; font-size: 13px">{{b.n}}</span></label>
</sc-for>
</fieldset>
<fieldset style="margin: 0; padding: 0 0 12px; border: 0; border-bottom: 1px solid #dde2ea; display: flex; flex-direction: column">
<legend style="padding: 0; font-weight: 600; margin-bottom: 4px">Brand</legend>
<sc-for list="{{brands}}" as="b" hint-placeholder-count="4">
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: {{b.color}}"><input type="checkbox" checked="{{b.on}}" disabled="{{b.disabled}}" onChange="{{b.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: {{primary}}"><span style="flex: 1 1 auto">{{b.name}}</span><span style="color: {{b.countColor}}; font-size: 13px">{{b.n}}</span></label>
</sc-for>
</fieldset>
<fieldset style="margin: 0; padding: 0 0 12px; border: 0; border-bottom: 1px solid #dde2ea; display: flex; flex-direction: column">
<legend style="padding: 0; font-weight: 600; margin-bottom: 4px">Colour</legend>
<sc-for list="{{colors}}" as="b" hint-placeholder-count="5">
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: {{b.color}}"><input type="checkbox" checked="{{b.on}}" disabled="{{b.disabled}}" onChange="{{b.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: {{primary}}"><span aria-hidden="true" style="width: 18px; height: 18px; flex: none; border-radius: 9px; background: {{b.swatch}}; box-shadow: inset 0 0 0 1px rgba(26,31,41,0.25)"></span><span style="flex: 1 1 auto">{{b.name}}</span><span style="color: {{b.countColor}}; font-size: 13px">{{b.n}}</span></label>
</sc-for>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
<legend style="padding: 0; font-weight: 600; margin-bottom: 4px">Material</legend>
<sc-for list="{{materials}}" as="b" hint-placeholder-count="4">
<label style="min-height: 44px; display: flex; align-items: center; gap: 12px; cursor: pointer; color: {{b.color}}"><input type="checkbox" checked="{{b.on}}" disabled="{{b.disabled}}" onChange="{{b.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: {{primary}}"><span style="flex: 1 1 auto">{{b.name}}</span><span style="color: {{b.countColor}}; font-size: 13px">{{b.n}}</span></label>
</sc-for>
<button type="button" onClick="{{toggleMaterials}}" aria-expanded="{{allMaterials}}" style="align-self: flex-start; height: 44px; padding: 0; border: 0; background: transparent; color: {{primary}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{materialToggle}}</button>
</fieldset>
</div>
<div style="padding: 12px 16px 16px; border-top: 1px solid #dde2ea">
<button type="button" onClick="{{closeSheets}}" style="width: 100%; height: 52px; border: 0; border-radius: 8px; background: {{primary}}; color: #ffffff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">{{showLabel}}</button>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{sortOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 20; background: rgba(26,31,41,0.5); display: flex; flex-direction: column; justify-content: flex-end">
<div role="dialog" aria-modal="true" aria-labelledby="s-h" style="background: #ffffff; border-radius: 16px 16px 0 0; padding-bottom: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 20px; border-bottom: 1px solid #dde2ea">
<h2 id="s-h" style="margin: 0; font-size: 18px; font-weight: 700">Sort by</h2>
<button type="button" onClick="{{closeSheets}}" aria-label="Close sort" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1a1f29; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div role="radiogroup" aria-labelledby="s-h" style="display: flex; flex-direction: column; padding: 4px 0">
<sc-for list="{{sorts}}" as="o" hint-placeholder-count="4">
<label style="min-height: 52px; padding: 0 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: {{o.weight}}"><input type="radio" name="m-sort" value="{{o.id}}" checked="{{o.on}}" onChange="{{o.pick}}" style="width: 22px; height: 22px; margin: 0; accent-color: {{primary}}">{{o.label}}</label>
</sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{picking}}" hint-placeholder-val="{{ false }}">
<dc-import name="QuickAdd" item="{{pick}}" phone="{{ true }}" on-close="{{closePick}}" on-add="{{addPicked}}" primary="{{primary}}" hint-size="100%,0px"></dc-import>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#1f4e8c","options":["#1f4e8c","#1b6e3a","#8b1e3f","#1a1f29"]},"$preview":{"width":390,"height":6000}}'>

        stock: function (p) { return !st.stock || !p.soldOut; },
        sale: function (p) { return !st.sale || !!p.compare; },
        price: function (p) { return !range || (p.price >= range[0] && p.price <= range[1]); },
        brand: function (p) { return !b.length || b.indexOf(p.brand) >= 0; },
        color: function (p) { return !c.length || (p.cols || []).some(function (x) { return c.indexOf(x) >= 0; }); },
        material: function (p) { return !m.length || m.indexOf(p.mat) >= 0; }
      };
      return function (p, except) { return Object.keys(test).every(function (k) { return k === except || test[k](p); }); };
    };
    var pass = make(s);
    var count = function (except, fn) { return all.filter(function (p) { return pass(p, except) && fn(p); }).length; };
    var row = function (name, n, isOn, toggle, extra) {
      var disabled = n === 0 && !isOn;
      return Object.assign({ name: name, n: String(n), on: isOn, disabled: disabled, color: disabled ? '#8a93a3' : '#1a1f29', countColor: disabled ? '#8a93a3' : '#545b69', toggle: toggle }, extra || {});
    };
    var flip = function (key, val) { var o = Object.assign({}, self.state[key]); o[val] = !o[val]; var st = {}; st[key] = o; self.setState(st); };
    var sortDefs = [
      { id: 'featured', label: 'Featured', short: 'Featured', fn: function (a, b) { return a.rank - b.rank; } },
      { id: 'newest', label: 'Newest', short: 'Newest', fn: function (a, b) { return a.age - b.age; } },
      { id: 'price_asc', label: 'Price: low to high', short: 'Price ↑', fn: function (a, b) { return a.price - b.price; } },
      { id: 'price_desc', label: 'Price: high to low', short: 'Price ↓', fn: function (a, b) { return b.price - a.price; } }
    ];
    var curSort = sortDefs.filter(function (d) { return d.id === s.sort; })[0];
    var list = all.filter(function (p) { return pass(p); }).sort(curSort.fn);
    var toCard = function (p) {
      var cols = (p.cols || []).length > 1 ? p.cols.map(function (c) { return { name: SHOW[c] || c, swatch: SW[c] }; }) : [];
      return {
        id: p.id, added: !!s.added[p.id], brand: p.brand, title: p.title, tone: p.tone, soldOut: !!p.soldOut, href: 'ProductPhone.dc.html',
        price: ((p.sizes || []).length > 1 ? 'From ' : '') + fmt(p.price),
        compare: p.compare ? fmt(p.compare) : '',
        off: p.compare ? '−' + Math.round((1 - p.price / p.compare) * 100) + '%' : '',
        value: p.price, compareValue: p.compare || 0,
        variants: { sizes: p.sizes || [], colors: cols }
      };
    };
    var priceDefs = [
      { key: '', label: 'Any price', fn: function () { return true; } },
      { key: 'u500', label: 'Under ৳500', fn: function (p) { return p.price < 500; } },
      { key: '500-1000', label: '৳500 to ৳1,000', fn: function (p) { return p.price >= 500 && p.price <= 1000; } },
      { key: '1000-2000', label: '৳1,000 to ৳2,000', fn: function (p) { return p.price > 1000 && p.price <= 2000; } },
      { key: 'o2000', label: 'Over ৳2,000', fn: function (p) { return p.price > 2000; } }
    ];
    var brandNames = ['Brand A', 'Brand B', 'Brand C', 'Brand D'];
    var colorNames = ['Black', 'White', 'Silver', 'Grey', 'Red', 'Blue', 'Green'];
    var matNames = ['Plastic', 'Stainless steel', 'Aluminium', 'Glass', 'Ceramic', 'Wood', 'Cast iron'];
    var matRows = matNames.map(function (m) { return row(m, count('material', function (p) { return p.mat === m; }), !!s.materials[m], function () { flip('materials', m); }); });
    var matShown = s.allMaterials ? matRows : matRows.filter(function (r, i) { return i < 4 || r.on; });
    var priceLabel = function () {
      if (s.price === 'custom') return (s.min ? fmt(Number(s.min)) : '৳0') + ' to ' + (s.max ? fmt(Number(s.max)) : 'any');
      var d = priceDefs.filter(function (x) { return x.key === s.price; })[0];
      return d ? d.label : '';
    };
    var chips = [];
    var without = function (patch) { return Object.assign({}, s, patch); };
    if (s.price) chips.push({ label: priceLabel(), st: without({ price: '', min: '', max: '' }) });
    if (s.stock) chips.push({ label: 'In stock', st: without({ stock: false }) });
    if (s.sale) chips.push({ label: 'On sale', st: without({ sale: false }) });
    on(s.brands).forEach(function (b) { var o = Object.assign({}, s.brands); o[b] = false; chips.push({ label: b, st: without({ brands: o }) }); });
    on(s.colors).forEach(function (c) { var o = Object.assign({}, s.colors); o[c] = false; chips.push({ label: c, st: without({ colors: o }) }); });
    on(s.materials).forEach(function (m) { var o = Object.assign({}, s.materials); o[m] = false; chips.push({ label: m, st: without({ materials: o }) }); });
    var chipVals = chips.map(function (c) {
      var n = all.filter(function (p) { return make(c.st)(p); }).length;
      var patch = {};
      ['stock', 'sale', 'price', 'min', 'max', 'brands', 'colors', 'materials'].forEach(function (k) { patch[k] = c.st[k]; });
      return { label: c.label, n: n, remove: function () { self.setState(patch); } };
    });
    var suggestions = chipVals.filter(function (c) { return c.n > 0; }).sort(function (a, b) { return b.n - a.n; }).slice(0, 2).map(function (c) {
      return { label: 'Remove “' + c.label + '” (' + c.n + (c.n === 1 ? ' product)' : ' products)'), apply: c.remove };
    });
    var filtered = chips.length > 0;
    var quickDefs = [
      { label: 'In stock', isOn: s.stock, n: count('stock', function (p) { return !p.soldOut; }), toggle: function () { self.setState({ stock: !self.state.stock }); } },
      { label: 'On sale', isOn: s.sale, n: count('sale', function (p) { return !!p.compare; }), toggle: function () { self.setState({ sale: !self.state.sale }); } },
      { label: 'Under ৳500', isOn: s.price === 'u500', n: count('price', function (p) { return p.price < 500; }), toggle: function () { self.setState({ price: self.state.price === 'u500' ? '' : 'u500', min: '', max: '' }); } }
    ];
    return {
      primary: primary,
      cartCount: s.count,
      subcats: ['Cookware', 'Tableware', 'Food storage', 'Kitchen tools', 'Water bottles'].map(function (n) { return { name: n }; }),
      countText: filtered ? list.length + (list.length === 1 ? ' product matches' : ' products match') : TOTAL + ' products',
      shownText: 'Showing ' + loadedN + ' of ' + TOTAL + ' products',
      progress: Math.round(loadedN / TOTAL * 100) + '%',
      canLoadMore: loadedN < TOTAL,
      loadMore: function () { self.setState({ more: self.state.more + 1 }); },
      showTop: s.scrolled || s.more > 0,
      quick: quickDefs.map(function (q) { return { label: q.label, n: String(q.n), on: q.isOn, border: q.isOn ? '2px solid ' + primary : '1px solid #c5ccd8', bg: q.isOn ? '#e8f0fa' : '#ffffff', toggle: q.toggle }; }),
      products: list.map(toCard),
      empty: list.length === 0,
      suggestions: suggestions,
      chips: chipVals,
      hasApplied: filtered,
      noApplied: !filtered,
      filterLabel: filtered ? 'Filters (' + chips.length + ')' : 'Filters',
      sortShort: 'Sort: ' + curSort.short,
      showLabel: list.length === 0 ? 'No matches: change a filter' : 'Show ' + list.length + (list.length === 1 ? ' product' : ' products'),
      clearAll: function () { self.setState({ stock: false, sale: false, price: '', min: '', max: '', minDraft: '', maxDraft: '', brands: {}, colors: {}, materials: {} }); },
      priceOpts: priceDefs.map(function (d) {
        var r = row(d.label, count('price', d.fn), s.price === d.key, null);
        r.label = d.label;
        r.pick = function () { self.setState({ price: d.key, min: '', max: '' }); };
        return r;
      }),
      minDraft: s.minDraft,
      maxDraft: s.maxDraft,
      setMinDraft: function (e) { self.setState({ minDraft: e.target.value }); },
      setMaxDraft: function (e) { self.setState({ maxDraft: e.target.value }); },
      applyCustom: function () { var st = self.state; if (st.minDraft || st.maxDraft) self.setState({ price: 'custom', min: st.minDraft, max: st.maxDraft }); },
      avail: [
        row('In stock only', count('stock', function (p) { return !p.soldOut; }), s.stock, function () { self.setState({ stock: !self.state.stock }); }),
        row('On sale', count('sale', function (p) { return !!p.compare; }), s.sale, function () { self.setState({ sale: !self.state.sale }); })
      ],
      brands: brandNames.map(function (b) { return row(b, count('brand', function (p) { return p.brand === b; }), !!s.brands[b], function () { flip('brands', b); }); }),
      colors: colorNames.map(function (c) { return row(c, count('color', function (p) { return (p.cols || []).indexOf(c) >= 0; }), !!s.colors[c], function () { flip('colors', c); }, { swatch: SW[c] }); }),
      materials: matShown,
      allMaterials: s.allMaterials,
      materialToggle: s.allMaterials ? 'Show fewer' : 'Show all ' + matNames.length + ' materials',
      toggleMaterials: function () { self.setState({ allMaterials: !self.state.allMaterials }); },
      sorts: sortDefs.map(function (d) {
        var isOn = d.id === s.sort;
        return { id: d.id, label: d.label, on: isOn, weight: isOn ? '600' : '400', pick: function () { self.setState({ sort: d.id, sortOpen: false }); } };
      }),
      filtersOpen: s.filtersOpen,
      sortOpen: s.sortOpen,
      openFilters: function () { self.setState({ filtersOpen: true, sortOpen: false }); },
      openSort: function () { self.setState({ sortOpen: true, filtersOpen: false }); },
      closeSheets: function () { self.setState({ filtersOpen: false, sortOpen: false }); },
      addOne: function (it) { var a = Object.assign({}, self.state.added); a[it.id] = true; self.setState({ count: self.state.count + 1, added: a }); },
      choose: function (it) { self.setState({ pick: it }); },
      picking: !!s.pick,
      pick: s.pick,
      closePick: function () { self.setState({ pick: null }); },
      addPicked: function (it) { var a = Object.assign({}, self.state.added); a[it.id] = true; self.setState({ count: self.state.count + 1, added: a, pick: null }); }
    };
  }
}
</script>
