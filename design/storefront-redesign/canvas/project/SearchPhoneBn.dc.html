<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>সার্চ, ফোন (বাংলা)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#1f4e8c}a:hover{color:#173c6d}
:focus-visible{outline:3px solid #1f4e8c;outline-offset:2px;box-shadow:0 0 0 2px #ffffff}
</style>
</helmet>
<div lang="{{lang}}" style="width: 390px; min-height: 100vh; position: relative; display: flex; flex-direction: column; font-family: 'Hind Siliguri', system-ui, sans-serif; color: #1a1f29; background: #ffffff; font-size: 15px; line-height: {{lineHeight}}">
<dc-import name="PhoneHeader" alt="{{altHref}}" bn="{{bn}}" primary="{{primary}}" cart-count="{{cartCount}}" back="HomePhone.dc.html" query="{{q}}" on-query="{{setQuery}}" hint-size="100%,132px"></dc-import>

<main style="flex: 1 1 auto; display: flex; flex-direction: column; padding-bottom: 32px">
<sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
<div style="padding: 16px 16px 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.3">{{t.resultsForX}}{{qShown}}{{t.resultsForEnd}}</h1>
<span role="status" style="color: #545b69; font-size: 14px">{{countText}}</span>
</div>
<div role="group" aria-label="{{t.filterByCategory}}" style="margin-top: 12px; display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 4px">
<sc-for list="{{facets}}" as="f" hint-placeholder-count="3">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="flex: none; height: 44px; padding: 0 14px; border-radius: 22px; border: {{f.border}}; background: {{f.bg}}; color: #1a1f29; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
<div style="margin: 8px 16px 0; padding: 8px 0; border-top: 1px solid #dde2ea; border-bottom: 1px solid #dde2ea; display: flex; align-items: center; justify-content: space-between; gap: 10px">
<label for="sp-sort" style="font-size: 14px; color: #545b69">{{t.sortBy}}</label>
<select id="sp-sort" value="{{sort}}" onChange="{{setSort}}" style="flex: 1 1 auto; max-width: 220px; height: 44px; padding: 0 10px; font: inherit; font-size: 15px; font-weight: 500; border: 1.5px solid #c5ccd8; border-radius: 8px; background: #ffffff; color: #1a1f29">
<option value="best">{{t.bestMatch}}</option>
<option value="price_asc">{{t.priceLowToHigh}}</option>
<option value="price_desc">{{t.priceHighToLow}}</option>
</select>
</div>
<div style="padding: 16px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px">
<sc-for list="{{results}}" as="p" hint-placeholder-count="5">
<dc-import name="ProductCard" bn="{{bn}}" item="{{p}}" added="{{p.added}}" compact="{{ true }}" on-add="{{addOne}}" on-choose="{{choose}}" primary="{{primary}}" hint-size="100%,380px"></dc-import>
</sc-for>
</div>
</sc-if>

<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
<div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.3">{{t.noResultsForX}}{{qShown}}{{t.noResultsForEnd}}</h1>
<sc-if value="{{hasSuggestion}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 16px">{{t.didYouMean}} <button type="button" onClick="{{useSuggestion}}" style="min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: {{primary}}; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer">{{suggestion}}</button>?</p>
</sc-if>
<ul style="margin: 0; padding-left: 20px; color: #3c4350; font-size: 14px; display: flex; flex-direction: column; gap: 4px">
<li>{{t.checkTheSpellingOr}}</li>
<li>{{t.useFewerOrMore}}</li>
<li>{{t.browseACategoryBelow}}</li>
</ul>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 600">{{t.popularSearches}}</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{popular}}" as="w" hint-placeholder-count="4">
<button type="button" onClick="{{w.pick}}" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #c5ccd8; background: #ffffff; color: #1a1f29; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{w.word}}</button>
</sc-for>
</div>
</div>
</div>
<section aria-labelledby="sp-cats" style="padding: 28px 16px 0">
<h2 id="sp-cats" style="margin: 0 0 12px; font-size: 20px; font-weight: 700">{{t.browseCategories}}</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
<a href="ListingPhone{{sfx}}.dc.html" style="min-height: 52px; padding: 0 14px; border-radius: 8px; background: {{c.tone}}; color: #1a1f29; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center">{{c.name}}</a>
</sc-for>
</div>
</section>
<section aria-labelledby="sp-pop" style="padding: 28px 16px 0">
<h2 id="sp-pop" style="margin: 0 0 12px; font-size: 20px; font-weight: 700">{{t.popularRightNow}}</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px">
<sc-for list="{{fallback}}" as="p" hint-placeholder-count="4">
<dc-import name="ProductCard" bn="{{bn}}" item="{{p}}" added="{{p.added}}" compact="{{ true }}" on-add="{{addOne}}" on-choose="{{choose}}" primary="{{primary}}" hint-size="100%,380px"></dc-import>
</sc-for>
</div>
</section>
</sc-if>
</main>

<dc-import name="PhoneFooter" alt="{{altHref}}" bn="{{bn}}" primary="{{primary}}" hint-size="100%,540px"></dc-import>

<div style="position: sticky; bottom: 0; z-index: 8">
<dc-import name="PhoneTabBar" bn="{{bn}}" active="categories" cart-count="{{cartCount}}" primary="{{primary}}" hint-size="100%,68px"></dc-import>
</div>

<sc-if value="{{picking}}" hint-placeholder-val="{{ false }}">
<dc-import name="QuickAdd" bn="{{bn}}" item="{{pick}}" phone="{{ true }}" on-close="{{closePick}}" on-add="{{addPicked}}" primary="{{primary}}" hint-size="100%,0px"></dc-import>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#1f4e8c","options":["#1f4e8c","#1b6e3a","#8b1e3f","#1a1f29"]},"bn":{"editor":"boolean","default":true},"$preview":{"width":390,"height":1950}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: props.bn ? 'প্যান' : 'pan', cat: '', sort: 'best', count: 0, added: {}, pick: null };
  }
  renderVals() {
    var bn = !!this.props.bn;
    // English → Bangla for text in this board's data (the store's own strings where it has them).
    var TR = {
      "22 cm": "২২ সেমি",
      "24 cm": "২৪ সেমি",
      "26 cm": "২৬ সেমি",
      "28 cm": "২৮ সেমি",
      "Airtight rice box, 10 kg": "এয়ারটাইট চালের বাক্স, ১০ কেজি",
      "Baby & kids": "শিশু ও বাচ্চা",
      "Beauty & health": "সৌন্দর্য ও স্বাস্থ্য",
      "Black": "কালো",
      "Blue": "নীল",
      "Cotton bedsheet set, double": "সুতির বিছানার চাদরের সেট, ডাবল",
      "Electric kettle, 1.8 litre": "ইলেকট্রিক কেটলি, ১.৮ লিটার",
      "Electronics": "ইলেকট্রনিক্স",
      "Fashion": "ফ্যাশন",
      "Granite grey": "গ্রানাইট ধূসর",
      "Groceries": "মুদি",
      "Home & living": "ঘর ও সাজসজ্জা",
      "Kids’ school backpack, 18 L": "বাচ্চাদের স্কুলব্যাগ, ১৮ লিটার",
      "Kitchen & dining": "রান্নাঘর ও খাবার",
      "LED desk lamp with USB charging": "ইউএসবি চার্জিংসহ এলইডি টেবিল ল্যাম্প",
      "Men’s cotton panjabi, regular fit": "ছেলেদের সুতির পাঞ্জাবি, রেগুলার ফিট",
      "Miniket rice, 5 kg": "মিনিকেট চাল, ৫ কেজি",
      "Non-stick frying pan with glass lid": "কাচের ঢাকনাসহ নন-স্টিক ফ্রাইপ্যান",
      "Non-stick kadai pan, 24 cm": "নন-স্টিক কড়াই, ২৪ সেমি",
      "Pan scrubbers, pack of 6": "পাত্র মাজার স্ক্রাবার, ৬টি",
      "Pressure cooker, 5 litre": "প্রেশার কুকার, ৫ লিটার",
      "Rechargeable table fan, 12 inch": "রিচার্জেবল টেবিল ফ্যান, ১২ ইঞ্চি",
      "Red": "লাল",
      "Silver": "রুপালি",
      "Stainless steel saucepan with lid, 18 cm": "ঢাকনাসহ স্টেইনলেস স্টিলের সসপ্যান, ১৮ সেমি",
      "Stainless steel water bottle, 1 L": "স্টেইনলেস স্টিলের পানির বোতল, ১ লিটার",
      "Stationery": "স্টেশনারি",
      "White": "সাদা"
    };
    var tr = function (x) { return bn && Object.prototype.hasOwnProperty.call(TR, x) ? TR[x] : x; };
    var num = function (n) { var x = typeof n === 'number' ? n.toLocaleString('en-US') : String(n); return bn ? x.replace(/\d/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; }) : x; };
    // The board's fixed copy: [English, Bangla].
    var T0 = {
      bestMatch: ["Best match", "সবচেয়ে মিল"],
      browseACategoryBelow: ["Browse a category below, or ask us on WhatsApp.", "নিচের ক্যাটাগরি দেখুন, বা হোয়াটসঅ্যাপে জিজ্ঞেস করুন।"],
      browseACategoryBelowWide: ["Browse a category below, or ask us on WhatsApp and we will help you find it.", "নিচের ক্যাটাগরি দেখুন, বা হোয়াটসঅ্যাপে জিজ্ঞেস করুন: আমরা খুঁজে দেব।"],
      browseCategories: ["Browse categories", "ক্যাটাগরি দেখুন"],
      checkTheSpellingOr: ["Check the spelling, or try the Bangla name.", "বানান দেখে নিন, বা ইংরেজি নামে খুঁজে দেখুন।"],
      didYouMean: ["Did you mean", "আপনি কি খুঁজছেন"],
      filterByCategory: ["Filter by category", "ক্যাটাগরি অনুযায়ী ফিল্টার"],
      noResultsForEnd: ["”", "”-এর কোনো ফলাফল নেই"],
      noResultsForX: ["No results for “", "“"],
      popularRightNow: ["Popular right now", "এখন জনপ্রিয়"],
      popularSearches: ["Popular searches", "জনপ্রিয় খোঁজ"],
      popularSearchesWide: ["Popular searches:", "জনপ্রিয় খোঁজ:"],
      priceHighToLow: ["Price: high to low", "দাম: বেশি থেকে কম"],
      priceLowToHigh: ["Price: low to high", "দাম: কম থেকে বেশি"],
      resultsForEnd: ["”", "”-এর ফলাফল"],
      resultsForX: ["Results for “", "“"],
      sortBy: ["Sort by", "সাজান"],
      useFewerOrMore: ["Use fewer or more general words, like “pan”.", "কম বা সাধারণ শব্দ লিখুন, যেমন “প্যান”।"],
      useFewerOrMoreWide: ["Use fewer or more general words, like “pan” instead of “26 cm frying pan”.", "কম বা সাধারণ শব্দ লিখুন, যেমন “২৬ সেমি ফ্রাইপ্যান”-এর বদলে “প্যান”।"]
    };
    var t = {};
    Object.keys(T0).forEach(function (k) { t[k] = T0[k][bn ? 1 : 0]; });
    var self = this;
    var s = this.state;
    var primary = this.props.primary ?? '#1f4e8c';
    var fmt = function (n) { return '৳' + num(n); };
    var catalog = [
      { id: 'pan', cat: 'Kitchen & dining', brand: 'Brand A', title: tr('Non-stick frying pan with glass lid'), price: 990, compare: 1190, tone: '#f1f3f6', cols: ['Black', 'Red', 'Grey'], sizes: [{ name: tr('22 cm'), price: 990, compare: 1190 }, { name: tr('24 cm'), price: 1150, compare: 1350 }, { name: tr('26 cm'), price: 1250, compare: 1490 }, { name: tr('28 cm'), price: 1450, compare: 1690, soldOut: true }] },
      { id: 'saucepan', cat: 'Kitchen & dining', brand: 'Brand A', title: tr('Stainless steel saucepan with lid, 18 cm'), price: 1450, tone: '#e8f0fa' },
      { id: 'kadai', cat: 'Kitchen & dining', brand: 'Brand B', title: tr('Non-stick kadai pan, 24 cm'), price: 1650, compare: 1890, tone: '#fdf0e1' },
      { id: 'scrub', cat: 'Home & living', brand: 'Brand D', title: tr('Pan scrubbers, pack of 6'), price: 180, tone: '#eef5e4' },
      { id: 'panjabi', cat: 'Fashion', brand: 'Brand C', title: tr('Men’s cotton panjabi, regular fit'), price: 1850, soldOut: true, tone: '#f8e9ee' },
      { id: 'cooker', cat: 'Kitchen & dining', brand: 'Brand A', title: tr('Pressure cooker, 5 litre'), price: 3150, tone: '#eceaf8' },
      { id: 'bottle', cat: 'Kitchen & dining', brand: 'Brand D', title: tr('Stainless steel water bottle, 1 L'), price: 590, compare: 690, tone: '#e6f4ef', cols: ['Silver', 'Blue', 'Black'] },
      { id: 'kettle', cat: 'Electronics', brand: 'Brand B', title: tr('Electric kettle, 1.8 litre'), price: 1690, tone: '#f8e9ee', cols: ['Black', 'White'] },
      { id: 'fan', cat: 'Electronics', brand: 'Brand B', title: tr('Rechargeable table fan, 12 inch'), price: 3450, compare: 3990, tone: '#eceaf8' },
      { id: 'lamp', cat: 'Electronics', brand: 'Brand B', title: tr('LED desk lamp with USB charging'), price: 1100, tone: '#eceaf8' },
      { id: 'rice', cat: 'Groceries', brand: 'Brand D', title: tr('Miniket rice, 5 kg'), price: 420, tone: '#eef5e4' },
      { id: 'ricebox', cat: 'Kitchen & dining', brand: 'Brand D', title: tr('Airtight rice box, 10 kg'), price: 790, tone: '#f1f3f6' },
      { id: 'sheet', cat: 'Home & living', brand: 'Brand C', title: tr('Cotton bedsheet set, double'), price: 1690, compare: 2100, tone: '#e8f0fa' },
      { id: 'bag', cat: 'Baby & kids', brand: 'Brand C', title: tr('Kids’ school backpack, 18 L'), price: 950, tone: '#fff4dd' }
    ];
    var SW = { Black: '#23262d', Red: '#a3302a', Grey: '#8a8f98', White: '#f4f4f2', Silver: '#c0c4ca', Blue: '#3a6ea5' };
    var SHOW = { Grey: 'Granite grey' };
    var toCard = function (p) {
      var cols = (p.cols || []).length > 1 ? p.cols.map(function (c) { return { name: tr(SHOW[c] || c), swatch: SW[c] }; }) : [];
      return { id: p.id, added: !!s.added[p.id], brand: p.brand, title: p.title, tone: p.tone, soldOut: !!p.soldOut, price: (p.sizes || []).length > 1 ? (bn ? fmt(p.price) + ' থেকে' : 'From ' + fmt(p.price)) : fmt(p.price), compare: p.compare ? fmt(p.compare) : '', off: p.compare ? '−' + num(Math.round((1 - p.price / p.compare) * 100)) + '%' : '', href: 'ProductPhone.dc.html', value: p.price, compareValue: p.compare || 0, variants: { sizes: p.sizes || [], colors: cols } };
    };
    var words = s.q.trim().toLowerCase().split(/\s+/).filter(function (w) { return w; });
    var matches = words.length ? catalog.filter(function (p) {
      // Bangla has no word starts to anchor on: match anywhere in the title.
      if (bn) return words.every(function (w) { return p.title.indexOf(w) >= 0; });
      var tw = p.title.toLowerCase().split(/[^a-z0-9]+/);
      return words.every(function (w) { return tw.some(function (t) { return t.indexOf(w) === 0; }); });
    }) : [];
    var cats = {};
    matches.forEach(function (p) { cats[p.cat] = (cats[p.cat] || 0) + 1; });
    var activeCat = s.cat && cats[s.cat] ? s.cat : '';
    var shown = activeCat ? matches.filter(function (p) { return p.cat === activeCat; }) : matches;
    if (s.sort === 'price_asc') shown = shown.slice().sort(function (a, b) { return a.price - b.price; });
    if (s.sort === 'price_desc') shown = shown.slice().sort(function (a, b) { return b.price - a.price; });
    var facets = [{ key: '', label: (bn ? 'সব (' : 'All (') + num(matches.length) + ')' }].concat(Object.keys(cats).map(function (c) { return { key: c, label: tr(c) + ' (' + num(cats[c]) + ')' }; }));
    var fixes = { fraying: 'frying', fryng: 'frying', botle: 'bottle', bottel: 'bottle', ketle: 'kettle', kettel: 'kettle', panjibi: 'panjabi' };
    var suggestion = words.length === 1 && fixes[words[0]] ? fixes[words[0]] : '';
    return {
      t: t,
      bn: bn,
      lang: bn ? 'bn' : 'en',
      altHref: bn ? 'SearchPhone.dc.html' : 'SearchPhoneBn.dc.html',
      lineHeight: bn ? '1.6' : '1.5',
      sfx: bn ? 'Bn' : '',
      primary: primary,
      cartCount: s.count,
      addOne: function (it) { var a = Object.assign({}, self.state.added); a[it.id] = true; self.setState({ count: self.state.count + 1, added: a }); },
      choose: function (it) { self.setState({ pick: it }); },
      picking: !!s.pick,
      pick: s.pick,
      closePick: function () { self.setState({ pick: null }); },
      addPicked: function (it) { var a = Object.assign({}, self.state.added); a[it.id] = true; self.setState({ count: self.state.count + 1, added: a, pick: null }); },
      q: s.q,
      qShown: s.q.trim() || '…',
      setQuery: function (v) { self.setState({ q: v, cat: '' }); },
      sort: s.sort,

      hasResults: matches.length > 0,
      noResults: matches.length === 0,
      countText: bn ? num(shown.length) + 'টি পণ্য' : shown.length + (shown.length === 1 ? ' product' : ' products'),
      facets: facets.map(function (f) {

      }),
      results: shown.map(toCard),
      hasSuggestion: !!suggestion,
      suggestion: suggestion,
      useSuggestion: function () { self.setState({ q: suggestion }); },
      popular: (bn ? ['প্যান', 'বোতল', 'কেটলি', 'চাল'] : ['pan', 'bottle', 'kettle', 'rice']).map(function (w) { return { word: w, pick: function () { self.setState({ q: w, cat: '' }); } }; }),
      cats: [
        { name: tr('Kitchen & dining'), tone: '#fdf0e1' },
        { name: tr('Home & living'), tone: '#e8f0fa' },
        { name: tr('Electronics'), tone: '#eceaf8' },
        { name: tr('Fashion'), tone: '#f8e9ee' },
        { name: tr('Beauty & health'), tone: '#e6f4ef' },
        { name: tr('Baby & kids'), tone: '#fff4dd' },
        { name: tr('Groceries'), tone: '#eef5e4' },
        { name: tr('Stationery'), tone: '#f1f3f6' }
      ],
      fallback: catalog.filter(function (p) { return ['pan', 'fan', 'sheet', 'bottle'].indexOf(p.id) >= 0; }).map(toCard)
    };
  }
}
</script>
</body>
</html>
