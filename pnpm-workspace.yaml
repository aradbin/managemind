# Astro 7.3.8 pins zod 4.6.5, which GHSA-mrhx-c7xc-m3w5 covers; the
# workspace's own zod has the fix. Remove once Astro's update is in.
# undici, under Astro, wrangler and the Sentry CLI, is moved to each line's
# fix for GHSA-xjj6-f33q-929c; remove once they depend on it themselves.
overrides:
  astro>zod: 4.6.7
  undici@6: 6.29.1
  undici@7: 7.30.2
  undici@8: 8.13.1

# GHSA-fc5q-39xc-vjpf (picomatch ReDoS through repeated extglobs, Nov 2026)
# has no fixed picomatch yet, so no override can move past it. picomatch
# arrives through the admin's route-file build plugin (tinyglobby) and Astro's
# storage driver lookup (anymatch); both match patterns from our own config,
# never shopper input. Remove once picomatch publishes a fix.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
