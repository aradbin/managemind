# Astro 7.3.8 pins zod 4.6.5, which GHSA-mrhx-c7xc-m3w5 covers; the
# workspace's own zod has the fix. Remove once Astro's update is in.
# undici, under Astro, wrangler and the Sentry CLI, is moved to each line's
# fix for GHSA-xjj6-f33q-929c; remove once they depend on it themselves.
overrides:
  astro>zod: 4.6.7
  undici@6: 6.29.1
  undici@7: 7.30.1
  undici@8: 8.12.3
